services:
  # ===========================================
  # Nginx Reverse Proxy & File Server
  # ===========================================
  nginx:
    image: nginx:1.25-bookworm
    container_name: bsdmirrors-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ---------------------------------------------------------------------
      # DIRECTORY mounts, not file mounts. This is load-bearing.
      # ---------------------------------------------------------------------
      #
      # A single-file bind mount pins an inode. `git checkout` writes a new file
      # and renames it over the old name, producing a new inode, and the
      # container keeps the old one -- so a config change reaches the host and
      # never reaches nginx. On 2026-08-31 the container was still serving a
      # 2026-02-12 nginx.conf; `nginx -t` passed and `nginx -s reload` succeeded,
      # both re-reading the February file. See nginx/loader.conf.
      #
      # A directory mount resolves the path on every open(), so a renamed-over
      # file is picked up by the next `nginx -s reload` with no recreate.
      #
      # ./nginx is mounted whole so nginx.conf and snippets/ are both visible.
      # sites-enabled is a SEPARATE mount of exactly one profile directory:
      # nginx.conf globs /etc/nginx/sites-enabled/*.conf, so mounting all of
      # ./nginx/sites there would load dev, bootstrap and production together
      # and have them fight over `listen 80` with conflicting server_names.
      #
      # loader.conf is the one remaining file mount and the one file in the repo
      # that must never change; it is a single `include` line pointing at the
      # tree below. /etc/nginx/nginx.conf cannot be a directory.
      - ./nginx/loader.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/host:ro
      - ./nginx/sites/${NGINX_SITE:-dev}:/etc/nginx/sites-enabled:ro
      - ./frontend/public:/var/www/public:ro
      - ${MIRROR_DATA_PATH:-/data/mirrors}:/data/mirrors:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Backend API (FastAPI)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsdmirrors-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-bsdmirrors}
      - POSTGRES_USER=${POSTGRES_USER:-bsdmirrors}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-8}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FREEBSD_UPSTREAM=${FREEBSD_UPSTREAM:-rsync://ftp.freebsd.org/FreeBSD/}
      - NETBSD_UPSTREAM=${NETBSD_UPSTREAM:-rsync://rsync.NetBSD.org/NetBSD/}
      - OPENBSD_UPSTREAM=${OPENBSD_UPSTREAM:-rsync://ftp2.eu.openbsd.org/OpenBSD/}
    volumes:
      - ${MIRROR_DATA_PATH:-/data/mirrors}:/data/mirrors:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Sync Service
  # ===========================================
  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: bsdmirrors-sync
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-bsdmirrors}
      - POSTGRES_USER=${POSTGRES_USER:-bsdmirrors}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FREEBSD_ENABLED=${FREEBSD_ENABLED:-true}
      - FREEBSD_UPSTREAM=${FREEBSD_UPSTREAM}
      - NETBSD_ENABLED=${NETBSD_ENABLED:-true}
      - NETBSD_UPSTREAM=${NETBSD_UPSTREAM}
      - OPENBSD_ENABLED=${OPENBSD_ENABLED:-true}
      - OPENBSD_UPSTREAM=${OPENBSD_UPSTREAM}
      - SYNC_SCHEDULE=${SYNC_SCHEDULE:-0 4 * * *}
      - SYNC_BANDWIDTH_LIMIT=${SYNC_BANDWIDTH_LIMIT:-0}
      - SYNC_TIMEOUT=${SYNC_TIMEOUT:-600}
      - SYNC_ON_STARTUP=${SYNC_ON_STARTUP:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${MIRROR_DATA_PATH:-/data/mirrors}:/data/mirrors
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      frontend:
        priority: 1000
      backend:
        priority: 500

  # ===========================================
  # Rsync Server
  # ===========================================
  rsync:
    build:
      context: ./rsync
      dockerfile: Dockerfile
    container_name: bsdmirrors-rsync
    restart: unless-stopped
    ports:
      - "${RSYNC_PORT:-873}:873"
    environment:
      - RSYNC_MAX_CONNECTIONS=${RSYNC_MAX_CONNECTIONS:-50}
    volumes:
      - ${MIRROR_DATA_PATH:-/data/mirrors}:/data/mirrors:ro
      - ./rsync/rsyncd.conf:/etc/rsyncd.conf:ro
    networks:
      - frontend
    profiles:
      - rsync

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-bookworm
    container_name: bsdmirrors-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bsdmirrors}
      - POSTGRES_USER=${POSTGRES_USER:-bsdmirrors}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsdmirrors} -d ${POSTGRES_DB:-bsdmirrors}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-bookworm
    container_name: bsdmirrors-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Certbot (SSL Certificate Management)
  # ===========================================
  certbot:
    image: certbot/certbot:latest
    container_name: bsdmirrors-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    profiles:
      - ssl

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  certbot-webroot:
  certbot-certs:
