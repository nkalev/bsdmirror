# bsdmirror CI
#
# This repo's first 36 commits contain 30 post-deploy "Fix ..." commits, almost
# all of them configuration and integration failures. The jobs below are chosen
# to catch that specific class of failure before a deploy, not to maximise
# coverage: compose parsing, nginx config parsing for every site profile using
# the mounts compose itself resolves, the security headers asserted on the wire
# from a really running nginx, plus the lint, SAST and test tooling that has
# been pinned in backend/requirements.txt and never run.
#
# Every version here is derived from something already in the repo:
#   PYTHON_VERSION  must equal the tag in backend/Dockerfile and sync/Dockerfile
#   NGINX_IMAGE     must equal the image in docker-compose.yml
#   ruff / bandit   installed from the pins in backend/requirements.txt
# Drift in any of those fails a job rather than passing on a version that never
# runs in production.

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  # Also on PRs so fork contributions are covered; same-repo branches will run
  # twice, which is the cheaper mistake of the two.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # backend/Dockerfile and sync/Dockerfile both use python:3.12-slim.
  PYTHON_VERSION: '3.12'
  # docker-compose.yml, service `nginx`.
  NGINX_IMAGE: nginx:1.25-bookworm
  # Pinned rather than using the runner's preinstalled shellcheck: a runner
  # image bump must not be able to turn a clean tree red on its own. Bumping
  # this is a deliberate commit, and the tree is clean at this version.
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0

jobs:
  # ---------------------------------------------------------------------------
  # ruff
  # ---------------------------------------------------------------------------
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff at the version pinned in backend/requirements.txt
        run: |
          pin="$(grep -E '^ruff==' backend/requirements.txt || true)"
          if [ -z "$pin" ]; then
            echo "::error file=backend/requirements.txt::no 'ruff==' pin found. CI installs the pinned version on purpose and will not guess one."
            exit 1
          fi
          echo "installing $pin"
          python -m pip install --disable-pip-version-check "$pin"

      - name: ruff check .
        run: |
          ruff --version
          ruff check --output-format=github .

  # ---------------------------------------------------------------------------
  # bandit
  # ---------------------------------------------------------------------------
  bandit:
    name: bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install bandit at the version pinned in backend/requirements.txt
        run: |
          pin="$(grep -E '^bandit==' backend/requirements.txt || true)"
          if [ -z "$pin" ]; then
            echo "::error file=backend/requirements.txt::no 'bandit==' pin found. CI installs the pinned version on purpose and will not guess one."
            exit 1
          fi
          echo "installing $pin"
          python -m pip install --disable-pip-version-check "$pin"

      # Full inventory, all severities. Informational only: it is here so the
      # low-severity findings stay visible in the log instead of being silently
      # filtered out by the gate below. The gate is the next step.
      - name: Bandit full report (informational, does not gate)
        run: bandit -r backend/app sync backend/alembic || true

      # Gate: MEDIUM severity and above.
      #
      # Severity floor rationale. An unfiltered run on this tree reports three
      # findings, all of them accepted by design:
      #   B106 backend/app/api/auth.py       token_type="bearer"        (LOW)
      #   B105 backend/app/core/security.py  "token_blacklist:" prefix  (LOW)
      #   B104 sync/sync_service.py:414      health server on 0.0.0.0   (MEDIUM)
      # The two LOW findings are string-heuristic false positives, hence the
      # MEDIUM floor. B104 is skipped explicitly rather than by lowering the
      # floor further: the sync service publishes no ports in docker-compose.yml,
      # so :8001 is reachable only from the compose networks, and binding to the
      # container's own interfaces is the only thing that works there.
      #
      # Suppressing these at the source with `# nosec` would be the better fix
      # and would let the floor drop to LOW, but backend/app/** and the body of
      # sync_service.py belong to the `developer` agent. Handed over, not edited.
      # backend/alembic is in scope: a migration is code that runs against the
      # production database, with more privilege than a route handler. It is
      # clean at LOW today, so it costs nothing to include and would cost a lot
      # to add later, after something in it needed a suppression.
      - name: Bandit gate (medium severity and above)
        run: bandit -r backend/app sync backend/alembic --severity-level medium --skip B104

  # ---------------------------------------------------------------------------
  # pytest
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # If the Dockerfiles move to a new interpreter, this job must move with
      # them. A green CI on a Python the containers never run is worse than no
      # CI at all.
      - name: Interpreter must match the container base image
        run: |
          fail=0
          for df in backend/Dockerfile sync/Dockerfile; do
            if ! grep -qE "^FROM python:${PYTHON_VERSION}-slim\b" "$df"; then
              echo "::error file=$df::expected 'FROM python:${PYTHON_VERSION}-slim'; found: $(grep -E '^FROM ' "$df" | tr '\n' ' ')"
              echo "::error file=$df::update PYTHON_VERSION in .github/workflows/ci.yml to match, or revert the base image"
              fail=1
            fi
          done
          exit "$fail"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # BOTH files feed this environment, so both must key the cache.
          # With only backend/requirements.txt here, editing
          # sync/requirements.txt restores a cache built before that edit and
          # the job passes against packages nobody asked for -- an
          # intermittent, environment-shaped failure that looks like flakiness.
          cache-dependency-path: |
            backend/requirements.txt
            sync/requirements.txt

      # The two files overlap on eight packages (asyncpg, croniter, httpx,
      # pydantic-settings, python-dotenv, redis, sqlalchemy, structlog). Today
      # they agree. This makes a future disagreement a named error here rather
      # than a pip ResolutionImpossible wall further down, and it also catches
      # the case pip cannot: one file pinning `redis==5.0.1` while the other
      # says `redis>=5.0`, which resolves cleanly and drifts silently.
      #
      # It also fails on any direct dependency that is not pinned with `==`.
      # That is the CI half of pinning bcrypt: `bcrypt>=4.0.0` let a rebuild
      # move the login path from 4.x to 5.0.0 unreviewed, and a pin with no
      # gate behind it just waits to be undone.
      - name: Requirement files must be exactly pinned and must agree
        run: |
          python - backend/requirements.txt sync/requirements.txt <<'PYCHECK'
          import re, sys
          from collections import defaultdict

          def norm(name):                      # PEP 503
              return re.sub(r"[-_.]+", "-", name).lower()

          seen = defaultdict(list)
          problems = []

          for path in sys.argv[1:]:
              with open(path) as fh:
                  for lineno, raw in enumerate(fh, 1):
                      line = raw.split("#", 1)[0].strip()
                      if not line:
                          continue
                      if line.startswith("-"):
                          problems.append("%s:%d: pip option lines are not supported "
                                          "by this check: %s" % (path, lineno, line))
                          continue
                      m = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(\[[^\]]*\])?\s*(.*)$", line)
                      if not m:
                          problems.append("%s:%d: cannot parse requirement: %s"
                                          % (path, lineno, line))
                          continue
                      name, extras, spec = m.group(1), (m.group(2) or ""), m.group(3).strip()
                      seen[norm(name)].append((path, lineno, extras, spec, line))

          for name, entries in sorted(seen.items()):
              for path, lineno, _extras, spec, line in entries:
                  if not spec.startswith("=="):
                      problems.append(
                          "%s:%d: '%s' is not pinned with '=='; found '%s'. A floating "
                          "direct dependency means the next image rebuild installs a "
                          "version nobody reviewed."
                          % (path, lineno, line, spec or "(no specifier)"))

          # Extras may legitimately differ between the two trees. The version may not.
          for name, entries in sorted(seen.items()):
              if len(entries) < 2:
                  continue
              if len({spec for (_p, _l, _e, spec, _r) in entries}) > 1:
                  where = "; ".join("%s:%d %s" % (p, l, r) for (p, l, _e, _s, r) in entries)
                  problems.append(
                      "'%s' is declared in more than one requirements file with "
                      "different versions: %s -- update every copy in the same commit."
                      % (name, where))

          shared = sorted(n for n, e in seen.items() if len(e) > 1)
          print("checked %d distinct packages across %d files; %d shared: %s"
                % (len(seen), len(sys.argv) - 1, len(shared), ", ".join(shared)))

          for p in problems:
              print("::error::%s" % p)
          if problems:
              sys.exit(1)
          print("all direct dependencies pinned, all shared pins agree")
          PYCHECK

      # sync/sync_service.py:15 does `from aiohttp import web` at module scope,
      # and aiohttp is declared only in sync/requirements.txt. tests/ imports
      # sync.sync_service, so installing backend/requirements.txt alone makes
      # pytest die during collection with ModuleNotFoundError and run zero
      # tests -- which is exactly what happened on 69c4131.
      #
      # ONE resolve across both files, not two sequential installs. Verified
      # locally with pip 26.0.1 on two files pinning the same package to
      # different versions: two `pip install -r` calls both exit 0 and the
      # second silently overwrites the first, while a single call with two
      # `-r` flags exits 1 with ResolutionImpossible. The eight shared pins
      # make that difference load-bearing.
      - name: Install backend and sync requirements in a single resolve
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            -r backend/requirements.txt \
            -r sync/requirements.txt

      - name: Installed versions must match the pins that were just requested
        run: |
          # Guards the cache path specifically: if a stale wheel cache or a
          # transitive constraint moved something off its pin, say so here
          # rather than letting the suite pass against an environment the
          # requirements files never described.
          python - backend/requirements.txt sync/requirements.txt <<'PYVERIFY'
          import re, sys
          from importlib.metadata import version, PackageNotFoundError

          fail = 0
          checked = 0
          for path in sys.argv[1:]:
              for raw in open(path):
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith("-"):
                      continue
                  m = re.match(r"^([A-Za-z0-9][A-Za-z0-9._-]*)(?:\[[^\]]*\])?==(.+)$", line)
                  if not m:
                      continue
                  name, want = m.group(1), m.group(2).strip()
                  try:
                      got = version(name)
                  except PackageNotFoundError:
                      print("::error::%s pins %s==%s but it is not installed"
                            % (path, name, want))
                      fail = 1
                      continue
                  checked += 1
                  if got != want:
                      print("::error::%s pins %s==%s but %s is installed"
                            % (path, name, want, got))
                      fail = 1
          print("verified %d pinned packages against the installed environment" % checked)
          sys.exit(fail)
          PYVERIFY

      # Pin Node, rather than inheriting whatever the runner ships.
      #
      # tests/js/csp_click_harness.mjs:93 drives Chrome over the DevTools
      # protocol using a global `WebSocket`, which Node did not ship as a global
      # until 22. This job had no version pin at all: it passed because the
      # ubuntu-24.04 image happened to be new enough, and would have started
      # failing on a runner-image bump with a ReferenceError six tests deep.
      # Debian bookworm's nodejs is 20.19, which is exactly where that breaks --
      # Dockerfile.test hit it and pins 22 for the same reason.
      - name: Pin Node (the CSP harness needs a global WebSocket, Node >= 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rsync, for the same reason node and Chrome are installed above.
      #
      # tests/test_protected_paths.py drives the REAL rsync binary to prove that
      # a protect filter survives an upstream deletion -- the whole point of the
      # EOL-archive feature. It carries a shutil.which("rsync") skipif, which is
      # right for a contributor's laptop and exactly wrong here: without the
      # binary those tests skip, the suite stays green, and nothing has shown
      # that 1.18 TB of EOL releases is actually protected.
      #
      # This job runs pytest on the bare runner, not in Dockerfile.test (which
      # installs rsync itself), so the runner needs it explicitly.
      - name: Install rsync (CI must never skip the protect-filter suite)
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          fi
          rsync --version | head -1

      # -----------------------------------------------------------------------
      # The browser-driven suites must RUN here, never skip
      # -----------------------------------------------------------------------
      #
      # tests/test_admin_js_escaping.py and tests/test_public_page_csp.py each
      # carry a pytest.mark.skipif for a missing `node` / Chrome. Locally that
      # is correct -- a contributor without Chrome should still get the rest of
      # the suite. In CI it is exactly wrong: it turns "the XSS-escaping and CSP
      # coverage did not run" into a green build. That is the same shape as a
      # limit_conn_zone that limits nothing and a health check that returns
      # before it can alert -- signal with no check underneath it.
      #
      # ubuntu-24.04 ships both today, so on a healthy build this step only
      # prints versions. It earns its place the day the runner image drops one.
      #
      # It imports the two test modules and reads the SAME module-level NODE and
      # CHROME values the skipif decorators evaluate, rather than running its own
      # `command -v node`. An independent probe would be free to drift from the
      # discovery logic it exists to guard -- reporting success while the tests
      # skip anyway, which is the bug rather than the fix. test_public_page_csp
      # resolves Chrome by walking a six-entry candidate list; this gate inherits
      # that list and stays correct when it changes.
      #
      # Versions are printed on every run on purpose: a runner-image bump then
      # shows up as a diff in the log of a PASSING build, instead of being
      # invisible until something breaks.
      - name: node and Chrome must be present (CI must never skip these suites)
        run: |
          python - <<'PYTOOLS'
          import subprocess
          import sys

          sys.path.insert(0, ".")
          import tests.test_admin_js_escaping as escaping   # noqa: E402
          import tests.test_public_page_csp as csp          # noqa: E402

          def describe(argv):
              try:
                  proc = subprocess.run(argv, capture_output=True, text=True, timeout=120)
              except Exception as exc:                       # noqa: BLE001
                  return "(could not run: %s)" % exc
              text = (proc.stdout or proc.stderr or "").strip()
              return text.splitlines()[0] if text else "(no version output)"

          problems = []

          # node backs both suites, so report the value each module resolved
          # rather than assuming they agree.
          for label, mod in (("test_admin_js_escaping", escaping),
                             ("test_public_page_csp", csp)):
              if mod.NODE is None:
                  problems.append(
                      "%s would SKIP: node not found. ubuntu-24.04 ships node; if the "
                      "runner image no longer does, add actions/setup-node to this job. "
                      "Do not let the suite skip -- that silently drops the escaping "
                      "coverage while the build stays green." % label)
              else:
                  print("node    [%-22s] %s  ->  %s"
                        % (label, mod.NODE, describe([mod.NODE, "--version"])))

          if csp.CHROME is None:
              problems.append(
                  "test_public_page_csp would SKIP: no Chrome or Chromium found. "
                  "Candidates tried: %s. ubuntu-24.04 ships google-chrome; if the runner "
                  "image no longer does, install it in this job. Do not let the suite "
                  "skip -- that silently drops the CSP click coverage."
                  % ", ".join(csp.CHROME_CANDIDATES))
          else:
              print("chrome  [%-22s] %s  ->  %s"
                    % ("test_public_page_csp", csp.CHROME, describe([csp.CHROME, "--version"])))

          # A renamed harness makes the suites error instead of skip, but the
          # message is a stack trace some way into a pytest run. Name it here.
          for label, path in (("escaping harness", escaping.HARNESS),
                              ("csp click harness", csp.HARNESS)):
              if not path.exists():
                  problems.append("%s is missing: %s" % (label, path))
              else:
                  print("%-18s %s" % (label + ":", path))

          for problem in problems:
              print("::error::%s" % problem)
          if problems:
              sys.exit(1)
          print("node and Chrome resolved; neither suite will skip in this job")
          PYTOOLS

      # The JUnit report is written to $RUNNER_TEMP, not the checkout: it is
      # consumed by the next step only, and a CI-shaped run should not leave an
      # untracked file in the working tree or need a .gitignore entry to hide
      # one. RUNNER_TEMP is set on every GitHub-hosted runner; the reader below
      # falls back to the cwd so the step is still runnable by hand.
      - name: pytest
        run: |
          python -c 'import sys; print("python", sys.version)'
          pytest --junit-xml="${RUNNER_TEMP:-.}/pytest-report.xml"

      # The step above proves the binaries exist. This proves the suites actually
      # ran. It is the general backstop: it fails on a skip from ANY cause,
      # including a skipif nobody has written yet, and it fails when a module
      # contributes no tests at all -- without that second check a rename would
      # make this gate silently vacuous, which is the failure it is here to stop.
      #
      # if: always() so a red pytest still reports what ran; the pytest step has
      # already failed the job by then.
      - name: The browser-driven suites must not have skipped
        if: always()
        run: |
          python - <<'PYSKIP'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          REPORT = Path(os.environ.get("RUNNER_TEMP") or ".") / "pytest-report.xml"

          # Dotted module paths as pytest writes them into @classname. Update
          # these together with any deliberate rename; a stale entry fails loudly
          # on the "contributed no tests" check below rather than passing.
          REQUIRED = ("tests.test_admin_js_escaping", "tests.test_public_page_csp",
                      "tests.test_protected_paths")

          if not REPORT.exists():
              print("::error::%s was not produced, so it cannot be shown that the "
                    "browser-driven suites ran at all. If pytest failed above, fix "
                    "that first." % REPORT)
              sys.exit(1)

          tally = {name: {"total": 0, "skipped": 0, "names": []} for name in REQUIRED}
          for case in ET.parse(REPORT).iter("testcase"):
              classname = case.get("classname") or ""
              for name in REQUIRED:
                  if classname == name or classname.startswith(name + "."):
                      entry = tally[name]
                      entry["total"] += 1
                      if case.find("skipped") is not None:
                          entry["skipped"] += 1
                          entry["names"].append(case.get("name"))

          fail = 0
          for name in REQUIRED:
              entry = tally[name]
              print("%-34s %4d tests, %d skipped" % (name, entry["total"], entry["skipped"]))
              if entry["total"] == 0:
                  print("::error::%s contributed no tests to this run. It was renamed, "
                        "deselected, or failed to collect -- either way its coverage is "
                        "not in this build. If the move was deliberate, update REQUIRED "
                        "in this step." % name)
                  fail = 1
              if entry["skipped"]:
                  print("::error::%s skipped %d test(s) in CI: %s. These two suites are "
                        "the XSS-escaping and CSP gates; a skip here is lost coverage on "
                        "a green build, not a neutral outcome."
                        % (name, entry["skipped"], ", ".join(entry["names"][:10])))
                  fail = 1
          sys.exit(fail)
          PYSKIP

  # ---------------------------------------------------------------------------
  # alembic
  # ---------------------------------------------------------------------------
  #
  # The schema used to come from `Base.metadata.create_all` at backend startup,
  # which creates missing TABLES and nothing else -- no column, no type, no
  # constraint, no complaint. Alembic now owns it, and this job is what stops
  # the migration chain and the models drifting apart the way the two model
  # definitions did before they were merged.
  #
  # Everything below runs INSIDE THE BACKEND IMAGE, against a real Postgres of
  # the version compose runs. That is deliberate. A migration that works from a
  # checkout and not from the image is the exact failure this repo keeps having:
  # backend/alembic.ini, backend/alembic/versions/ and shared/models/ all have
  # to arrive together, at the right paths, for `scripts/migrate.sh` to work on
  # the server -- and only building the image proves that.
  #
  # What each step proves, in order:
  #   1. the versions/ tree is a single linear chain with one head
  #   2. the image contains a working alembic setup at /app/alembic.ini
  #   3. `alembic upgrade head` builds the schema on an empty database
  #      (this is the fresh-install path -- `setup.sh --clean`)
  #   4. `alembic check` finds nothing left to do afterwards
  #   5. the schema Alembic builds is BYTE-FOR-BYTE the schema
  #      Base.metadata.create_all builds -- which is how production got its
  #      schema, and is what tests/test_shared_models.py pins to the live dump.
  #      Step 4 cannot see column comments or index methods; this can.
  #   6. the three copies of the database URL agree
  migrations:
    name: alembic (image build, fresh upgrade, empty diff)
    runs-on: ubuntu-24.04
    env:
      # docker-compose.yml, service `postgres`. Asserted below, not trusted.
      POSTGRES_IMAGE: postgres:16-bookworm
      PGPASSWORD: ci-placeholder-not-a-secret
      COMPOSE_PROJECT_NAME: bsdmirror
    steps:
      - uses: actions/checkout@v4

      - name: The Postgres version here must be the one compose runs
        run: |
          want=$(grep -A2 '^  postgres:' docker-compose.yml | awk '/image:/ {print $2; exit}')
          if [ "$want" != "$POSTGRES_IMAGE" ]; then
            echo "::error file=docker-compose.yml::this job pins POSTGRES_IMAGE=$POSTGRES_IMAGE but compose runs $want. Migrating against a different major version proves nothing about production."
            exit 1
          fi
          echo "ok: $POSTGRES_IMAGE matches docker-compose.yml"

      # A branched history means `alembic upgrade head` is ambiguous and
      # `migrate.sh` renders SQL for a range that does not exist. Two people
      # generating a migration from the same parent produces exactly this, and
      # nothing else in the repo would notice.
      - name: Exactly one head, and every revision reachable from it
        run: |
          python3 - <<'PYHEADS'
          import pathlib, re, sys

          versions = pathlib.Path("backend/alembic/versions")
          files = sorted(p for p in versions.glob("*.py") if p.name != "__init__.py")
          if not files:
              print("::error::backend/alembic/versions/ is empty. The baseline migration is what the production database is stamped at; losing it makes every deployment un-migratable.")
              sys.exit(1)

          revs, downs, problems = {}, {}, []
          for path in files:
              src = path.read_text()
              rev = re.search(r'^revision: str = [\'"]([^\'"]+)[\'"]', src, re.M)
              down = re.search(r'^down_revision: Union\[str, None\] = (.+)$', src, re.M)
              if not rev or not down:
                  problems.append("%s: cannot parse revision/down_revision" % path)
                  continue
              revs[rev.group(1)] = path.name
              raw = down.group(1).strip()
              downs[rev.group(1)] = None if raw == "None" else raw.strip("'\"")

          heads = [r for r in revs if r not in set(downs.values())]
          roots = [r for r, d in downs.items() if d is None]

          if len(heads) != 1:
              problems.append("expected exactly 1 head, found %d: %s" % (len(heads), heads))
          if len(roots) != 1:
              problems.append("expected exactly 1 root, found %d: %s" % (len(roots), roots))
          for rev, down in downs.items():
              if down is not None and down not in revs:
                  problems.append("%s revises %r, which is not a revision in this tree" % (rev, down))

          for problem in problems:
              print("::error::%s" % problem)
          if problems:
              sys.exit(1)
          print("ok: %d revision(s), root %s, head %s" % (len(revs), roots[0], heads[0]))
          PYHEADS

      - name: Write .env fixture (placeholder values, never real secrets)
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret
          REDIS_PASSWORD=ci-placeholder-not-a-secret
          SECRET_KEY=ci-placeholder-not-a-secret
          ADMIN_PASSWORD=ci-placeholder-not-a-secret
          FREEBSD_UPSTREAM=rsync://ftp.freebsd.org/FreeBSD/
          NETBSD_UPSTREAM=rsync://rsync.NetBSD.org/NetBSD/
          OPENBSD_UPSTREAM=rsync://ftp2.eu.openbsd.org/OpenBSD/
          EOF

      - name: Build the backend image (the one migrations actually run from)
        run: docker compose build backend

      # Not `services:` -- that maps a port to the runner, and every step below
      # runs INSIDE a container. A user-defined network is what lets the backend
      # image reach it by name, exactly as the compose `backend` network does.
      - name: Start Postgres and apply backend/init.sql
        run: |
          docker network create ci-alembic
          docker run -d --name ci-pg --network ci-alembic \
            -e POSTGRES_USER=bsdmirrors \
            -e POSTGRES_DB=bsdmirrors \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -v "$PWD/backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            "$POSTGRES_IMAGE"
          # Wait for the REAL server, not the temporary one.
          #
          # backend/init.sql is mounted into /docker-entrypoint-initdb.d/, and
          # the official postgres entrypoint handles that by starting a
          # TEMPORARY server, running the init scripts against it, then
          # SHUTTING IT DOWN and starting the real one. A single successful
          # pg_isready can therefore be the temporary server, and the next
          # command lands in the restart gap:
          #
          #     postgres ready after 2s
          #     /var/run/postgresql:5432 - rejecting connections
          #     ##[error]Process completed with exit code 1
          #
          # Not a flake. This failed two separate PRs, both dismissed as CI
          # being unreliable. Reproduced locally by polling pg_isready every
          # 0.3s against this exact image with an init script mounted:
          #
          #     .RRRRRR.RRRRRRRRRRRRRRRR...
          #      ^^^^^^ ^
          #      temp   the restart
          #
          # Counting consecutive successes would only narrow the window, not
          # close it: a slower init script keeps the temporary server up longer
          # and any fixed count eventually fits inside it. That is a
          # timing-based fix to a timing bug.
          #
          # The entrypoint prints this line exactly once, after the temporary
          # server is shut down and before the real one starts. Waiting for it
          # is deterministic regardless of how long the init scripts take.
          marker="PostgreSQL init process complete; ready for start up."
          for i in $(seq 1 120); do
            if docker logs ci-pg 2>&1 | grep -qF "$marker"; then
              echo "init scripts finished after ${i}s; the temporary server is gone"
              break
            fi
            sleep 1
          done
          if ! docker logs ci-pg 2>&1 | grep -qF "$marker"; then
            echo "::error::postgres never printed \"$marker\" in 120s. The container is always created fresh here with an init script mounted, so that line is expected on every run; its absence means the entrypoint did not get as far as starting the real server."
            docker logs ci-pg 2>&1 | tail -40
            exit 1
          fi
          # Only now is pg_isready answering for the server that will still be
          # running when the next step connects.
          for i in $(seq 1 60); do
            docker exec ci-pg pg_isready -U bsdmirrors -d bsdmirrors >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-pg pg_isready -U bsdmirrors -d bsdmirrors
          # A second, independent database for the create_all control below.
          docker exec ci-pg psql -U bsdmirrors -d postgres -c 'CREATE DATABASE control OWNER bsdmirrors;'
          docker exec ci-pg psql -U bsdmirrors -d control -f /docker-entrypoint-initdb.d/init.sql

      - name: Alembic must work from inside the image, at the image's paths
        run: |
          run() {
            docker run --rm --network ci-alembic \
              -e POSTGRES_HOST=ci-pg \
              -e POSTGRES_USER=bsdmirrors \
              -e POSTGRES_DB=bsdmirrors \
              -e POSTGRES_PASSWORD="$PGPASSWORD" \
              "$@"
          }
          echo "::group::alembic heads, from /app/alembic.ini"
          run bsdmirror-backend alembic -c /app/alembic.ini heads --verbose
          echo "::endgroup::"

          echo "::group::alembic upgrade head on an EMPTY database (the fresh-install path)"
          run bsdmirror-backend alembic -c /app/alembic.ini upgrade head
          echo "::endgroup::"

          echo "::group::alembic check -- must find nothing to do"
          run bsdmirror-backend alembic -c /app/alembic.ini check
          echo "::endgroup::"

          echo "::group::schema_diff.py -- the same claim, one level lower"
          run bsdmirror-backend python /app/alembic/schema_diff.py
          echo "::endgroup::"

          echo "::group::offline render must work too (this is the review path)"
          run bsdmirror-backend alembic -c /app/alembic.ini upgrade base:head --sql | head -40
          echo "::endgroup::"

      # THE CONTROL EXPERIMENT.
      #
      # `Base.metadata.create_all` is how the production database got its
      # schema, and tests/test_shared_models.py pins those models against a dump
      # of the live database. So "alembic upgrade head == create_all" closes the
      # chain: migrations -> models -> production.
      #
      # This is the ONLY create_all left anywhere near this repo and it exists
      # to be compared against, not to build anything. Do not copy it into the
      # application: tests/test_shared_models.py::test_create_all_has_exactly_one_caller
      # asserts there are zero callers in Python source.
      - name: The migrated schema must equal the create_all schema, byte for byte
        run: |
          docker run --rm --network ci-alembic \
            -e ALEMBIC_DATABASE_URL="postgresql+asyncpg://bsdmirrors:$PGPASSWORD@ci-pg:5432/control" \
            bsdmirror-backend python -c '
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from shared.models import Base
          async def main():
              e = create_async_engine(os.environ["ALEMBIC_DATABASE_URL"])
              async with e.begin() as c:
                  await c.run_sync(Base.metadata.create_all)
              await e.dispose()
          asyncio.run(main())
          print("control schema built by create_all")
          '
          # The migrated database carries an alembic_version table the control
          # one does not; that is the only permitted difference, so it is
          # excluded from both sides rather than tolerated in a diff.
          dump() {
            docker exec ci-pg pg_dump -U bsdmirrors -d "$1" --schema-only --no-owner --no-privileges \
              --exclude-table=alembic_version \
              | grep -v '^--' | grep -v '^\\restrict' | grep -v '^\\unrestrict' | grep -v '^$'
          }
          dump bsdmirrors > /tmp/alembic.sql
          dump control    > /tmp/create_all.sql
          echo "alembic upgrade head: $(wc -l < /tmp/alembic.sql) lines"
          echo "create_all:           $(wc -l < /tmp/create_all.sql) lines"
          if ! diff -u /tmp/create_all.sql /tmp/alembic.sql; then
            echo "::error::backend/alembic/versions/ does not build the schema shared/models/ describes. The migration chain and the models have drifted; a fresh install and an existing deployment would end up with different databases."
            exit 1
          fi
          echo "ok: identical"

      # backend/alembic/runtime.py builds the database URL from POSTGRES_* by
      # hand rather than importing app.core.config, for the reasons in its
      # docstring. That makes it the third copy of one f-string (the others are
      # backend/app/core/config.py and sync/sync_service.py). Copies drift; this
      # is the thing that makes them fail loudly instead.
      - name: The alembic URL builder and Settings.DATABASE_URL must agree
        run: |
          docker run --rm \
            -e POSTGRES_USER=someuser \
            -e POSTGRES_PASSWORD=somepassword \
            -e POSTGRES_HOST=somehost \
            -e POSTGRES_PORT=15432 \
            -e POSTGRES_DB=somedb \
            -e REDIS_PASSWORD=ci-placeholder-not-a-secret \
            -e SECRET_KEY=ci-placeholder-not-a-secret \
            -e ADMIN_PASSWORD=ci-placeholder-not-a-secret \
            bsdmirror-backend python -c '
          import sys
          sys.path.insert(0, "/app/alembic")
          from runtime import database_url
          from app.core.config import Settings
          alembic_url = database_url()
          app_url = Settings().DATABASE_URL
          print("alembic/runtime.py :", alembic_url)
          print("app/core/config.py :", app_url)
          if alembic_url != app_url:
              print("::error file=backend/alembic/runtime.py::database_url() and Settings.DATABASE_URL disagree. Migrations would run against a different database than the application.")
              sys.exit(1)
          print("ok: identical")
          '

      - name: Tear down
        if: always()
        run: |
          docker rm -f ci-pg >/dev/null 2>&1 || true
          docker network rm ci-alembic >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # docker compose config
  # ---------------------------------------------------------------------------
  compose:
    name: docker compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # docker compose falls back to a blank string for any unset ${VAR} and
      # still exits 0, so `config -q` on a bare checkout passes while telling you
      # nothing. This fixture supplies exactly the seven variables that have no
      # compose-level default; the guard below then fails the job if compose
      # warns about an eighth, which is how a newly added variable that nobody
      # put in .env or the README gets caught here instead of on the server.
      - name: Write .env fixture (placeholder values, never real secrets)
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret
          REDIS_PASSWORD=ci-placeholder-not-a-secret
          SECRET_KEY=ci-placeholder-not-a-secret
          ADMIN_PASSWORD=ci-placeholder-not-a-secret
          FREEBSD_UPSTREAM=rsync://ftp.freebsd.org/FreeBSD/
          NETBSD_UPSTREAM=rsync://rsync.NetBSD.org/NetBSD/
          OPENBSD_UPSTREAM=rsync://ftp2.eu.openbsd.org/OpenBSD/
          EOF
          echo "wrote .env with $(grep -c '=' .env) variables"

      - name: Validate compose (production, dev overlay, and both profiles)
        run: |
          docker compose version

          # --profile rsync --profile ssl: the `rsync` and `certbot` services are
          # behind profiles and are not even parsed without them.
          run_config() {
            desc="$1"; shift
            echo "::group::docker compose $* config -q  --  $desc"
            set +e
            docker compose "$@" --profile rsync --profile ssl --profile test config -q 2>.compose.err
            rc=$?
            set -e
            cat .compose.err
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::compose config failed for: $desc"
              return 1
            fi
            if grep -q 'variable is not set' .compose.err; then
              echo "::error::compose references a variable that is neither defaulted in docker-compose.yml nor present in the CI .env fixture."
              echo "::error::Add it to the fixture in .github/workflows/ci.yml AND to the environment table in README.md, or give it a default in compose."
              return 1
            fi
            return 0
          }

          rc=0
          run_config "production" || rc=1
          run_config "dev overlay" -f docker-compose.yml -f docker-compose.dev.yml || rc=1
          exit "$rc"

      # NGINX_SITE selects a DIRECTORY under nginx/sites/ which compose mounts as
      # /etc/nginx/sites-enabled. A typo, or a profile directory that was renamed
      # without updating setup.sh/ssl-setup.sh, resolves to a path that does not
      # exist -- and docker then CREATES it as an empty directory at `up` time
      # and starts nginx with no server block at all. Compose does not warn.
      # Check every value the scripts can write.
      - name: Every NGINX_SITE the scripts can write must resolve to a real profile
        run: |
          fail=0
          for site in dev bootstrap production; do
            src=$(NGINX_SITE="$site" docker compose config --format json \
                  | python3 -c 'import json,sys; print(next(v["source"] for v in json.load(sys.stdin)["services"]["nginx"]["volumes"] if v["target"]=="/etc/nginx/sites-enabled"))')
            if [ ! -d "$src" ]; then
              echo "::error::NGINX_SITE=$site resolves to $src, which does not exist. docker would create it empty and nginx would start with no server block."
              fail=1
            else
              echo "ok: NGINX_SITE=$site -> $src"
            fi
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # nginx -t
  # ---------------------------------------------------------------------------
  #
  # The highest-value job here. Validated against the exact image compose runs,
  # so the module set, compiled-in paths and the `nginx` user are the production
  # ones rather than an ubuntu apt build's.
  #
  # THE MOUNT RECIPE IS DERIVED FROM docker-compose.yml, NOT WRITTEN HERE.
  #
  # It used to be written here, as a hardcoded pair of `-v` flags. That made this
  # job an independent guess at what production looked like, and on 2026-08-31
  # the guess and production turned out to have been different since February:
  # compose mounted two INDIVIDUAL FILES (a single-file bind mount pins an inode,
  # and git renames a new file over the old one, so config changes never reached
  # the container) while the file that actually served the site was an untracked
  # `cp default.conf production.conf`. This job was validating a layout that
  # nothing ran, and reporting success.
  #
  # `docker compose config` is now the single source of the mount list, and the
  # coverage assertion in scripts/ci-nginx-mounts.py fails the job if compose
  # grows an /etc/nginx mount this job does not map. Changing the mount scheme in
  # compose therefore cannot leave CI validating the old one.
  #
  # What this does and does not prove:
  #   proves     syntax, directive context, unknown directives, duplicate
  #              server/location blocks, that every include resolves, that every
  #              ssl_certificate path is loadable (nginx reads certificates
  #              during `-t`), and -- in the last step -- that the headers come
  #              out of a really running server on the wire.
  #   does not   that `backend:8000` resolves, or that /data/mirrors exists.
  #     prove    Those need the full stack and belong to the deploy gate,
  #              scripts/deploy.sh verify_security_headers().
  nginx:
    name: nginx -t (all site profiles)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Structure of nginx/ must match what compose and the scripts expect
        run: |
          fail=0

          # NGINX_SITE selects a DIRECTORY under nginx/sites/. These three are
          # named in docker-compose.yml, scripts/setup.sh and
          # scripts/ssl-setup.sh; a rename breaks a deploy silently.
          for required in dev bootstrap production; do
            if [ ! -d "nginx/sites/$required" ]; then
              echo "::error::nginx/sites/$required/ is missing, but docker-compose.yml, scripts/setup.sh or scripts/ssl-setup.sh select it by name"
              fail=1
            fi
          done

          # Exactly one .conf per profile. nginx.conf globs
          # /etc/nginx/sites-enabled/*.conf and the mount makes a profile
          # directory *be* sites-enabled, so a second file in one of these is a
          # second server block fighting over `listen 80` -- the kind of thing
          # this repo has historically discovered in production.
          for d in nginx/sites/*/; do
            n=$(find "$d" -maxdepth 1 -name '*.conf' -type f | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::$d contains $n .conf files; exactly 1 is allowed, because that directory IS sites-enabled"
              fail=1
            fi
          done

          # nginx/loader.conf is the only single-file bind mount left, and it is
          # safe only because it never changes. Enforce that it stays a stub. If
          # real configuration ever lands in it, the inode trap comes back for
          # that configuration and nothing will say so.
          directives=$(grep -vc '^[[:space:]]*#\|^[[:space:]]*$' nginx/loader.conf || true)
          if [ "$directives" -ne 1 ]; then
            echo "::error file=nginx/loader.conf::must contain exactly 1 directive, found $directives. This file is bind-mounted individually, which pins an inode; anything that changes belongs under the directory mount."
            fail=1
          fi
          if ! grep -q '^include /etc/nginx/host/nginx.conf;$' nginx/loader.conf; then
            echo "::error file=nginx/loader.conf::must be exactly 'include /etc/nginx/host/nginx.conf;'"
            fail=1
          fi

          # `proxy_pass $variable/uri;` silently truncates the request.
          #
          # When proxy_pass contains a variable, nginx does NOT do the usual
          # "replace the matched location prefix and append the remainder" -- it
          # sends the literal URI written here and discards everything after the
          # prefix. dev.conf and bootstrap.conf both had
          # `proxy_pass $backend_upstream/api/;` inside `location /api/`, so the
          # backend received exactly `/api/` for every request:
          #
          #     GET  /api/health      -> backend saw GET  /api/   404
          #     POST /api/auth/token  -> backend saw POST /api/   404
          #
          # The whole API was dead in both profiles. `nginx -t` accepts either
          # form; only a real request tells them apart, and neither profile is
          # ever exercised with a real request in production. Found 2026-08-31
          # by reading the backend access log during a local stack run.
          # ^[^#]* so a comment that QUOTES the broken form -- which both fixed
          # files now carry, to say why -- does not fail the build. [^#]* cannot
          # cross the '#', so only a live directive matches.
          if grep -rnE '^[^#]*proxy_pass[[:space:]]+\$[A-Za-z_][A-Za-z0-9_]*/' nginx/; then
            echo "::error::proxy_pass with a variable followed by a URI drops everything after the location prefix. Use 'proxy_pass \$upstream;' with no URI part, which forwards the client's request URI unchanged -- that is what sites/production/production.conf does."
            fail=1
          fi

          # The site configs are tracked and domain-free. A domain reappearing in
          # nginx/ means someone reintroduced the generated-config pattern that
          # kept production invisible to git for six months.
          if grep -rn 'mirror\.example\.com' nginx/; then
            echo "::error::a domain is hardcoded in nginx/. Site configs are domain-free; the only domain-dependent lines are rendered into nginx/snippets/tls-cert.conf by scripts/nginx-apply.sh."
            fail=1
          fi

          exit "$fail"

      # /health must be defined in EVERY server block, not just the one somebody
      # was looking at. It was defined in the :80 server of production.conf and
      # not the :443 server, so over TLS it fell through to `location /`, hit
      # try_files .../index.html and answered 200 with the homepage. `nginx -t`
      # passes on that config -- it is valid -- and every probe this repo had
      # read the status line and the headers and never the body, so all of them
      # called it green.
      #
      # This is the structural half. The behavioural half is the last step in
      # this job, which reads the bytes off the wire on every profile and every
      # scheme. Both are here because either alone has a blind spot: the
      # structural check cannot see a snippet that stops working, and the wire
      # check cannot cover a profile CI does not boot.
      - name: Every server block in every site profile must serve /health
        run: python3 scripts/ci-nginx-health.py

      - name: Write .env fixture (placeholder values, never real secrets)
        run: |
          cat > .env <<'EOF'
          DOMAIN=ci.bsdmirror.test
          NGINX_SITE=production
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret
          REDIS_PASSWORD=ci-placeholder-not-a-secret
          SECRET_KEY=ci-placeholder-not-a-secret
          ADMIN_PASSWORD=ci-placeholder-not-a-secret
          FREEBSD_UPSTREAM=rsync://ftp.freebsd.org/FreeBSD/
          NETBSD_UPSTREAM=rsync://rsync.NetBSD.org/NetBSD/
          OPENBSD_UPSTREAM=rsync://ftp2.eu.openbsd.org/OpenBSD/
          EOF

      - name: Render the generated snippet with the real script
        run: |
          # scripts/nginx-apply.sh render is what runs on the server, called by
          # ssl-setup.sh and by deploy.sh. Running the actual script here rather
          # than reproducing its output is the point: the old fixture was a
          # hand-copied `cp default.conf production.conf` + sed, and a copy of a
          # generator is just a second thing to drift.
          ./scripts/nginx-apply.sh render
          echo "::group::nginx/snippets/tls-cert.conf"
          cat nginx/snippets/tls-cert.conf
          echo "::endgroup::"
          if ! grep -q 'ci\.bsdmirror\.test' nginx/snippets/tls-cert.conf; then
            echo "::error file=scripts/nginx-apply.sh::render did not substitute DOMAIN"
            exit 1
          fi

      - name: Build the certificate and webroot fixtures
        run: |
          # nginx loads certificates during `-t`, so the production profile
          # cannot be validated without a readable key pair where tls-cert.conf
          # says it is.
          d=ci-fixtures/letsencrypt/live/ci.bsdmirror.test
          mkdir -p "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=ci.bsdmirror.test" \
            -keyout "$d/privkey.pem" -out "$d/fullchain.pem" 2>/dev/null

          mkdir -p ci-fixtures/www/admin ci-fixtures/www/css ci-fixtures/www/img
          echo ok      > ci-fixtures/www/index.html
          echo notfound> ci-fixtures/www/404.html
          echo admin   > ci-fixtures/www/admin/index.html
          echo 'body{}'> ci-fixtures/www/css/style.css
          echo '<svg/>'> ci-fixtures/www/img/favicon.svg

      - name: Pull ${{ env.NGINX_IMAGE }}
        run: docker pull -q "$NGINX_IMAGE"

      - name: nginx -t every site profile, using compose's own mounts
        run: |
          set -o pipefail
          rc=0
          profiles=(nginx/sites/*/)
          for d in "${profiles[@]}"; do
            profile=$(basename "$d")
            echo "::group::nginx -t  NGINX_SITE=$profile"

            # read -r, not mapfile: mapfile is bash 4+, and this loop is also
            # run by hand on macOS (bash 3.2) when someone is reproducing a CI
            # failure. One argument per line, so a path containing a space
            # cannot be split into two broken arguments the way `$args` would.
            args=()
            while IFS= read -r line; do args+=("$line"); done < <(python3 scripts/ci-nginx-mounts.py "$profile")

            # An empty array here is the dangerous case, not a harmless one:
            # `docker run nginx nginx -t` with no mounts validates the STOCK
            # IMAGE config and prints "test is successful". Verified by running
            # exactly that during development. Refuse instead.
            if [ "${#args[@]}" -eq 0 ]; then
              echo "::error::scripts/ci-nginx-mounts.py produced no mounts for profile '$profile'; nginx -t would have validated the stock image config and passed"
              rc=1; echo "::endgroup::"; continue
            fi
            echo "mounts derived from docker-compose.yml:"
            printf '  %s\n' "${args[@]}"

            set +e
            # nginx -T, not -t: -T additionally dumps the resolved configuration
            # with a `# configuration file <path>:` banner per included file,
            # which is how the assertion below proves the tree mount was really
            # used rather than trusting an exit code.
            #
            # No -c. nginx/loader.conf is mounted at /etc/nginx/nginx.conf
            # precisely so a bare `nginx -t` validates the real tree; if this
            # ever needs -c, the mount scheme has regressed.
            docker run --rm "${args[@]}" \
              -v "$PWD/ci-fixtures/letsencrypt:/etc/letsencrypt:ro" \
              "$NGINX_IMAGE" nginx -T >nginx-t.out 2>&1
            trc=$?
            set -e
            grep -E '^(nginx:|# configuration file)' nginx-t.out || true
            echo "::endgroup::"

            if [ "$trc" -ne 0 ]; then
              echo "::error file=$d::nginx -T failed for profile $profile"
              cat nginx-t.out
              rc=1
              continue
            fi

            # Provenance. Without this, a job whose mounts silently stopped
            # working still reports success -- which is the entire 2026-08-31
            # failure, one layer up.
            for must in /etc/nginx/host/nginx.conf /etc/nginx/host/snippets/security-headers.conf; do
              if ! grep -q "^# configuration file $must:" nginx-t.out; then
                echo "::error file=$d::nginx did not read $must for profile $profile -- the mounts are not reaching it, so this check proved nothing"
                rc=1
              fi
            done
            if ! grep -qE "^# configuration file /etc/nginx/sites-enabled/.*\.conf:" nginx-t.out; then
              echo "::error file=$d::nginx read no site config from /etc/nginx/sites-enabled for profile $profile"
              rc=1
            fi

            if grep -q '\[warn\]' nginx-t.out; then
              echo "::warning file=$d::nginx -T passed with warnings for profile $profile"
            fi
            echo "ok: $profile"
          done

          if [ "${#profiles[@]}" -lt 3 ]; then
            echo "::error::expected at least 3 site profiles (dev, bootstrap, production), found ${#profiles[@]}"
            exit 1
          fi
          echo "validated ${#profiles[@]} nginx site profiles"
          exit "$rc"

      # `nginx -t` proves the config parses. It does NOT prove the headers reach
      # a client, and that is the whole failure of 2026-08-31: a container
      # reading a six-month-old inode passes `nginx -t` happily.
      #
      # This step starts the production profile for real and asserts the header
      # set on the wire, per path, using the same probes as
      # scripts/deploy.sh verify_security_headers(). Per path because add_header
      # does not inherit: one location adding a single header of its own drops
      # every inherited one, which is how /admin, the static-asset location and
      # the whole 443 server each lost the set in turn.
      - name: Serve the production profile and assert the headers on the wire
        run: |
          set -o pipefail
          args=()
          while IFS= read -r line; do args+=("$line"); done < <(python3 scripts/ci-nginx-mounts.py production)
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no mounts derived"; exit 1; }

          docker run -d --name ci-nginx -p 18443:443 "${args[@]}" \
            -v "$PWD/ci-fixtures/letsencrypt:/etc/letsencrypt:ro" \
            -v "$PWD/ci-fixtures/www:/var/www/public:ro" \
            "$NGINX_IMAGE"

          for _ in $(seq 1 30); do
            curl -sk -o /dev/null "https://localhost:18443/" && break
            sleep 1
          done

          want="x-frame-options x-content-type-options referrer-policy content-security-policy strict-transport-security"
          fails=0
          # /health is in this list as well as in the body-probe step below:
          # this asserts it keeps the header set (it adds no add_header of its
          # own, so it inherits the 443 server's), that one the bytes.
          for path in / /health /admin/ /css/style.css /img/favicon.svg /404.html /nope-404; do
            hdrs=$(curl -sk -o /dev/null -D - "https://localhost:18443$path" | tr -d '\r' | tr '[:upper:]' '[:lower:]')
            code=$(printf '%s\n' "$hdrs" | awk '/^http\//{c=$2} END{print c}')
            missing=""
            for h in $want; do
              printf '%s\n' "$hdrs" | grep -q "^$h:" || missing="$missing $h"
            done
            if [ -n "$missing" ]; then
              echo "::error::$path returned $code and is missing:$missing"
              fails=$((fails + 1))
            else
              printf '  %-22s %-5s 5/5 ok\n' "$path" "$code"
            fi
          done

          echo "::group::nginx logs"
          docker logs ci-nginx 2>&1 | tail -30
          echo "::endgroup::"
          docker rm -f ci-nginx >/dev/null

          if [ "$fails" -ne 0 ]; then
            echo "::error::add_header does not inherit. A block that adds any header of its own drops every inherited one; include nginx/snippets/security-headers-tls.conf in that block, then add."
            exit 1
          fi
          echo "all probed paths carry the full 5-header set"

      # THE BODY, NOT THE STATUS CODE.
      #
      # This is the check whose absence let /health lie over HTTPS for as long
      # as the 443 server has existed. A 200 is not evidence: the failure mode
      # is a 200 that carries the homepage. So this asserts the exact bytes,
      # the Content-Type, and that the two schemes return the same thing.
      #
      # Every profile is booted, not just production, because dev and bootstrap
      # are the ones an operator reaches for when something is already broken --
      # and dev has no TLS server at all, which is precisely why the divergence
      # was invisible there.
      - name: /health must return the same bytes on every profile and scheme
        run: |
          set -o pipefail
          fails=0

          probe() {   # url, expected-content-type-substring
            local url="$1" want_ct="$2" code ct body
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$url")
            # Fold header names to lowercase: HTTP/2 lowercases them, HTTP/1.1
            # does not, and the 443 server sets `http2 on`.
            ct=$(curl -sk -o /dev/null -D - --max-time 10 "$url" | tr -d '\r' \
                 | tr '[:upper:]' '[:lower:]' | awk '/^content-type:/{print $2}' | head -1)
            body=$(curl -sk --max-time 10 "$url")
            printf '  %-42s %-4s %-12s %s\n' "$url" "$code" "${ct:-<none>}" \
              "$(printf '%s' "$body" | head -c 40 | tr '\n' '~')"
            local bad=""
            [ "$code" = "200" ] || bad="$bad status=$code(want 200);"
            case "$ct" in *"$want_ct"*) ;; *) bad="$bad content-type=${ct:-<none>}(want $want_ct);" ;; esac
            # $(...) strips the trailing newline, so this compares "OK".
            [ "$body" = "OK" ] || bad="$bad body is not OK -- it is $(printf '%s' "$body" | head -c 80 | tr '\n' ' ');"
            if [ -n "$bad" ]; then
              echo "::error::$url:$bad"
              fails=$((fails + 1))
            fi
          }

          for profile in nginx/sites/*/; do
            profile=$(basename "$profile")
            args=()
            while IFS= read -r line; do args+=("$line"); done < <(python3 scripts/ci-nginx-mounts.py "$profile")
            [ "${#args[@]}" -gt 0 ] || { echo "::error::no mounts for $profile"; fails=$((fails + 1)); continue; }

            docker rm -f ci-health >/dev/null 2>&1 || true
            docker run -d --name ci-health -p 18080:80 -p 18443:443 "${args[@]}" \
              -v "$PWD/ci-fixtures/letsencrypt:/etc/letsencrypt:ro" \
              -v "$PWD/ci-fixtures/www:/var/www/public:ro" \
              "$NGINX_IMAGE" >/dev/null

            for _ in $(seq 1 30); do
              curl -s -o /dev/null --max-time 2 "http://localhost:18080/health" && break
              sleep 1
            done

            echo "::group::/health -- profile $profile"
            printf '  %-42s %-4s %-12s %s\n' "URL" "CODE" "TYPE" "BODY"
            probe "http://localhost:18080/health" "text/plain"

            # Does this profile serve TLS at all? dev and bootstrap do not, by
            # design, and asserting https on them would be a false failure.
            # Derived from the config rather than from a hardcoded profile name,
            # so a profile that GAINS a 443 server is covered the day it does.
            # [[:space:]] rather than \s: \s is a GNU extension. This job is
            # also run by hand on macOS when someone reproduces a CI failure,
            # and BSD grep -E would silently match nothing -- turning "this
            # profile has no TLS server" into a false pass for a profile that
            # does.
            if grep -qE '^[[:space:]]*listen[[:space:]]+(\[::\]:)?443' "nginx/sites/$profile"/*.conf; then
              probe "https://localhost:18443/health" "text/plain"
              a=$(curl -sk --max-time 10 "http://localhost:18080/health" | sha256sum | cut -d" " -f1)
              b=$(curl -sk --max-time 10 "https://localhost:18443/health" | sha256sum | cut -d" " -f1)
              if [ "$a" = "$b" ]; then
                echo "  http and https bodies are byte-identical ($a)"
              else
                echo "::error::$profile: /health differs between schemes -- http $a, https $b"
                fails=$((fails + 1))
              fi
            else
              echo "  no 443 server in this profile: https not probed"
            fi

            # The literal healthcheck from docker-compose.yml. If this ever
            # fails the nginx container is permanently unhealthy and
            # scripts/deploy.sh dependencies_must_be_up() blocks every deploy.
            if docker exec ci-health curl -f -s -o /dev/null http://localhost/health; then
              echo "  container healthcheck (curl -f http://localhost/health): exit 0"
            else
              echo "::error::$profile: the docker-compose healthcheck command failed"
              fails=$((fails + 1))
            fi
            echo "::endgroup::"
            docker rm -f ci-health >/dev/null
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::/health is not consistent across profiles and schemes. A 200 is not enough: the failure this guards is a 200 carrying the homepage, which every external monitor reads as healthy."
            exit 1
          fi
          echo "/health returns 200 text/plain OK on every profile and every scheme it serves"

  # ---------------------------------------------------------------------------
  # docker build (root context)
  # ---------------------------------------------------------------------------
  #
  # docker-compose.yml builds `backend` and `sync` with `context: .` so both
  # images can COPY the one shared models package in shared/. Those models used
  # to be declared twice by hand -- backend/app/models/ and sync/sync_service.py
  # -- and had drifted once, 798ae79, a Postgres enum mismatch found in
  # production. There is now a single definition and two scoped COPY lines, so
  # the context has THREE admitted subtrees: backend/, sync/ and shared/.
  #
  # A root context means the build sees the whole repository. What is at the root
  # of this one: .env and .credentials (real secrets on a server), a `data/`
  # symlink that points at 2.4 TB of mirror data in production, .git, frontend/
  # with 13 woff2 fonts, and tests/. The root .dockerignore is the filter, and
  # until this change nothing had ever exercised it -- no build had used the root
  # as its context, so it was a file full of patterns that had never once been
  # applied.
  #
  # This job exercises it, adversarially. It plants canary files everywhere the
  # ignore rules are supposed to reach, builds both images, and then scans EVERY
  # LAYER BLOB -- not the running filesystem -- for the canary string. The
  # distinction matters: a file added in one layer and deleted in a later one is
  # absent from `docker run ... ls` and still shipped inside the image.
  #
  # And it plants a canary that SHOULD ship, asserting that one is found. Without
  # it, a scanner that silently matched nothing would report a clean image
  # forever. This repo has shipped that shape of bug more than once: a
  # limit_conn_zone limiting nothing, a health check that returned before it
  # could alert, a `nginx -t` re-reading a six-month-old inode.
  docker-build:
    name: docker build (root context, secret audit)
    runs-on: ubuntu-24.04
    env:
      NEG: CANARY_MUSTNOTSHIP_2f81cc03
      POS: CANARY_SHOULDSHIP_2f81cc03
      # shared/ carries its OWN positive marker, and deliberately not one that
      # contains POS as a substring: the layer scan greps for the two
      # separately, so a hit on one can never stand in for the other. With a
      # single shared string, an image whose own subtree COPY had stopped
      # shipping would still report a positive hit -- off shared/ -- and the
      # control on the control would be satisfied by the wrong file.
      # (Named POS_SHARED, counted into `sharedhit`: an env POSS beside a local
      # `poss` reads as a typo to a human and to shellcheck, SC2153.)
      POS_SHARED: CANARY_SHAREDSHIP_2f81cc03
      # Compose derives the project name -- and therefore the image names -- from
      # the checkout directory. Pinned so the audit steps below cannot look for
      # an image that a renamed working directory has made something else.
      COMPOSE_PROJECT_NAME: bsdmirror
    steps:
      - uses: actions/checkout@v4

      - name: Build contexts and ignore files must be consistent
        run: |
          fail=0

          # Any service built from the repo root depends on the root
          # .dockerignore. Its absence would silently ship the whole tree.
          if [ ! -f .dockerignore ]; then
            echo "::error::.dockerignore is missing while the backend and sync services build from the repo root. Every file in this repository would be sent to the daemon."
            fail=1
          fi

          # Docker reads .dockerignore from the root of the BUILD CONTEXT. Once a
          # service moves to `context: .`, an ignore file left behind in its old
          # subdirectory is inert -- and an inert file that looks authoritative is
          # how the previous root .dockerignore sat unexercised for months.
          for stale in backend/.dockerignore sync/.dockerignore; do
            if [ -f "$stale" ]; then
              echo "::error file=$stale::this service builds from the repo root, so Docker never reads this file. It is inert and misleading; fold its rules into the root .dockerignore and delete it."
              fail=1
            fi
          done

          # A root context plus `COPY . .` ships .env into a layer. The COPY
          # scoping is the second lock, independent of .dockerignore; it is the
          # one that holds when the ignore file is wrong.
          for df in backend/Dockerfile sync/Dockerfile; do
            if grep -nE '^[[:space:]]*COPY([[:space:]]+--[^[:space:]]+)*[[:space:]]+\.[[:space:]]' "$df"; then
              echo "::error file=$df::a bare 'COPY . <dest>' from a repo-root context copies .env, .credentials, .git and the data/ symlink into a layer. Scope every COPY to a named subdirectory."
              fail=1
            fi
          done
          exit "$fail"

      - name: Plant canaries -- negative controls (must never reach a layer)
        run: |
          # At the context root, where the real secrets live.
          printf 'SECRET_KEY=%s_root_env\n'       "$NEG" > .env
          printf 'ADMIN_PASSWORD=%s_root_creds\n' "$NEG" > .credentials
          # In directories the ignore file names.
          mkdir -p data newtopleveldir
          printf '%s_data\n'     "$NEG" > data/canary.txt
          printf '%s_tests\n'    "$NEG" > tests/canary.txt
          printf '%s_frontend\n' "$NEG" > frontend/public/canary.txt
          printf '%s_nginx\n'    "$NEG" > nginx/canary.txt
          printf '%s_scripts\n'  "$NEG" > scripts/canary.txt
          # A NEW top-level directory. Under a denylist this ships by default and
          # nothing says so; under the current allowlist it must not.
          printf '%s_newdir\n'   "$NEG" > newtopleveldir/canary.txt
          # Inside the ADMITTED subtrees -- these exercise the `**/` prefixes,
          # which are the rules that do not work without it.
          printf 'SECRET_KEY=%s_backend_env\n' "$NEG" > backend/.env
          mkdir -p backend/app/__pycache__
          printf '%s_pycache\n'  "$NEG" > backend/app/__pycache__/canary.pyc
          printf '%s_synclog\n'  "$NEG" > sync/debug.log

      - name: Plant canaries -- positive controls (must reach the image)
        run: |
          # Without these the audit below could pass by matching nothing at all.
          printf '%s_backend\n' "$POS" > backend/canary-admitted.txt
          printf '%s_sync\n'    "$POS" > sync/canary-admitted.txt
          # shared/ is the third admitted subtree and the only one BOTH images
          # copy. It needs a control of its own: every other check here would
          # still pass if shared/ stopped shipping, and the failure would then
          # surface as an ImportError when a container starts -- in a deploy,
          # not in a build. One admitted subtree, one positive control.
          printf '%s_shared\n'  "$POS_SHARED" > shared/canary-admitted.txt

      - name: What the root context actually sends to the daemon
        run: |
          cat > /tmp/Dockerfile.ctx <<'EOF'
          FROM busybox:1.36
          COPY . /ctx
          EOF
          docker build -q -f /tmp/Dockerfile.ctx -t ctx-probe . >/dev/null
          echo "::group::every path in the build context"
          docker run --rm ctx-probe find /ctx -mindepth 1 | sed 's|^/ctx|.|' | sort
          echo "::endgroup::"
          echo "context size: $(docker run --rm ctx-probe du -sh /ctx | cut -f1)"

          # Top level must be exactly the subtrees a COPY reads. Asserted rather
          # than eyeballed: this is the line that fails the day someone adds a
          # top-level directory and a `!` for it without thinking.
          #
          # This list has grown exactly once, on purpose: `shared` arrived with
          # the models package, a `!shared` in .dockerignore and a scoped
          # `COPY shared/ ./shared` in BOTH Dockerfiles. That is what a subtree
          # someone thought about looks like, and widening the list is the right
          # response to it -- in the same change, by hand.
          #
          # DO NOT make this dynamic. An expectation derived from the `!` lines
          # in .dockerignore agrees with that file by construction: it would go
          # green for any future `!whatever`, which is the precise mistake this
          # step exists to catch. The cost of the explicit list is one line of
          # human edit per deliberate subtree. That cost is the feature.
          got=$(docker run --rm ctx-probe sh -c 'ls -A /ctx')
          want=$(printf 'backend\nshared\nsync\n')
          if [ "$(printf '%s\n' "$got" | sort | tr '\n' ' ')" != "$(printf '%s\n' "$want" | sort | tr '\n' ' ')" ]; then
            echo "::error::the root build context should contain exactly: $(printf '%s' "$want" | tr '\n' ' '); it contains: $(printf '%s' "$got" | tr '\n' ' ')"
            echo "::error::If the new entry is deliberate -- it has a '!' in .dockerignore AND a scoped COPY that reads it -- add it to 'want' in this step. If it is not, it is now in the build context of both images and should not be."
            exit 1
          fi
          echo "ok: context top level is exactly backend/, shared/ and sync/"

      - name: Build backend and sync
        run: |
          cat > .env.compose <<'EOF'
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret
          REDIS_PASSWORD=ci-placeholder-not-a-secret
          ADMIN_PASSWORD=ci-placeholder-not-a-secret
          FREEBSD_UPSTREAM=rsync://ftp.freebsd.org/FreeBSD/
          NETBSD_UPSTREAM=rsync://rsync.NetBSD.org/NetBSD/
          OPENBSD_UPSTREAM=rsync://ftp2.eu.openbsd.org/OpenBSD/
          EOF
          # .env is a canary file in this job, so compose reads the fixture
          # instead. The canary .env must stay on disk: it is the thing being
          # tested.
          cat .env.compose >> .env
          docker compose build backend sync

      - name: Every layer of every image must be free of the negative canaries
        run: |
          fail=0
          for img in bsdmirror-backend bsdmirror-sync; do
            work=$(mktemp -d)
            docker save "$img" -o "$work/img.tar"
            mkdir -p "$work/x" && tar -xf "$work/img.tar" -C "$work/x"

            neg=0; pos=0; sharedhit=0; blobs=0
            while IFS= read -r blob; do
              blobs=$((blobs + 1))
              case "$(file -b --mime-type "$blob")" in
                application/gzip|application/x-gzip) gunzip -c "$blob" > "$work/b" 2>/dev/null || cp "$blob" "$work/b" ;;
                *) cp "$blob" "$work/b" ;;
              esac
              grep -aq -- "$NEG" "$work/b" && { neg=$((neg + 1)); echo "::error::$img: a negative canary is present in layer $(basename "$blob")"; }
              grep -aq -- "$POS"  "$work/b" && pos=$((pos + 1))
              grep -aq -- "$POS_SHARED" "$work/b" && sharedhit=$((sharedhit + 1))
              # Filenames too: a secret can leak under a name even when its
              # contents happen not to match.
              if tar -tf "$work/b" > "$work/m" 2>/dev/null; then
                if grep -aqE '(^|/)(\.env|\.credentials)$' "$work/m"; then
                  echo "::error::$img: layer $(basename "$blob") contains a file named .env or .credentials:"
                  grep -aE '(^|/)(\.env|\.credentials)$' "$work/m" | sed 's/^/    /'
                  neg=$((neg + 1))
                fi
              fi
              rm -f "$work/b"
            done < <(find "$work/x" -type f)

            echo "$img: scanned $blobs layer blob(s) -- $neg negative hit(s), $pos own-subtree positive hit(s), $sharedhit shared/ positive hit(s)"
            [ "$neg" -eq 0 ] || fail=1

            # THE CONTROL ON THE CONTROL. A scanner that finds nothing because it
            # is broken looks exactly like a clean image.
            if [ "$pos" -eq 0 ]; then
              echo "::error::$img: the positive canary was NOT found in any layer. Either the COPY stopped shipping application code, or this scan is not reading the layers -- and a scan that cannot find a file it planted cannot prove the absence of anything."
              fail=1
            fi

            # And the same control for the subtree both images copy. shared/
            # holds the SQLAlchemy models backend and sync now import instead of
            # declaring twice; if it stops arriving, nothing above notices and
            # the image fails at 'import shared.models' when it is started.
            if [ "$sharedhit" -eq 0 ]; then
              echo "::error::$img: the shared/ positive canary was NOT found in any layer. The shared models package did not ship. Check '!shared' in .dockerignore and the scoped 'COPY shared/ ./shared' in this image's Dockerfile."
              fail=1
            fi
            rm -rf "$work"
          done
          exit "$fail"

      - name: The images must run, not merely build
        run: |
          # A build that succeeds and an image that starts are different claims.
          #
          # backend/app/core/config.py builds a pydantic Settings at import time
          # and four fields have no default, so `import app.main` raises
          # ValidationError with no environment. Placeholders are supplied here
          # for that reason and no other -- they are not a fixture for behaviour,
          # only for reaching the import. Nothing here connects to a database.
          docker run --rm \
            -e POSTGRES_PASSWORD=ci-placeholder-not-a-secret \
            -e REDIS_PASSWORD=ci-placeholder-not-a-secret \
            -e SECRET_KEY=ci-placeholder-not-a-secret \
            -e ADMIN_PASSWORD=ci-placeholder-not-a-secret \
            bsdmirror-backend python -c "import app.main; print('backend imports ok:', app.main.app.title)"
          docker run --rm bsdmirror-sync    python -c "import sync_service; print('sync imports ok')"
          echo "::group::image contents under /app"
          docker run --rm --entrypoint sh bsdmirror-backend -c 'find /app -maxdepth 2 | sort'
          docker run --rm --entrypoint sh bsdmirror-sync    -c 'find /app -maxdepth 2 | sort'
          echo "::endgroup::"

          # The positive canaries prove the allowlist admits new files under the
          # three subtrees; the negatives must be absent from the running fs too.
          #
          # Both images, not just the backend: shared/ is copied by each of them
          # independently, so "it shipped into one" says nothing about the other.
          for img in bsdmirror-backend bsdmirror-sync; do
            docker run --rm --entrypoint sh "$img" -c 'test -f /app/canary-admitted.txt' \
              || { echo "::error::$img: a new file under its own subtree did not reach the image -- the allowlist is too tight"; exit 1; }
            docker run --rm --entrypoint sh "$img" -c 'test -f /app/shared/canary-admitted.txt' \
              || { echo "::error::$img: a new file under shared/ did not reach /app/shared. Both images COPY the shared models package; without it this container dies at import time, on a deploy, instead of here."; exit 1; }
          done
          for f in /app/.env /app/.credentials /app/debug.log /app/app/__pycache__; do
            if docker run --rm --entrypoint sh bsdmirror-backend -c "test -e $f"; then
              echo "::error::backend: $f is present in the image"; exit 1
            fi
          done
          echo "ok: both images run, admit what they should and exclude what they must"

  # ---------------------------------------------------------------------------
  # shellcheck
  # ---------------------------------------------------------------------------
  #
  # scripts/ holds this repo's deploy-time behaviour -- setup.sh writes .env,
  # ssl-setup.sh generates the nginx config that serves production, deploy.sh is
  # the gate every deploy now passes through -- and none of it was linted.
  #
  # The three findings fixed to make this job green on its first run are a fair
  # sample of what it catches, and none of them are style:
  #   backup.sh      unquoted $KEEP_DAYS on a line ending in `find -delete`
  #   ssl-setup.sh   `if [[ $? -ne 0 ]]` after a bare command, under `set -e`,
  #                  so the certbot diagnostics were unreachable
  #   deploy.sh      SC2086 word-splitting a GitHub API response (caught in
  #                  review, before the file was ever committed)
  #
  # Run at shellcheck's default severity, which is the strictest: the tree is
  # clean there, so there is no reason to lower it. The only suppression in the
  # repo is two SC1091 for `. /etc/os-release`, which is on the target host and
  # cannot be followed from a checkout.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pull ${{ env.SHELLCHECK_IMAGE }}
        run: docker pull -q "$SHELLCHECK_IMAGE"

      - name: shellcheck scripts/*.sh
        run: |
          docker run --rm "$SHELLCHECK_IMAGE" --version

          # Glob, not a hardcoded list: a new scripts/*.sh is linted the day it
          # lands rather than the day it breaks a deploy.
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no scripts/*.sh found -- the glob or the directory moved"
            exit 1
          fi
          echo "linting ${#files[@]} script(s): ${files[*]}"

          set +e
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" \
            --format=gcc "${files[@]}" >shellcheck.out
          rc=$?
          set -e
          cat shellcheck.out

          # gcc format is  path:line:col: severity: message [SCxxxx]
          sed -E 's|^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$|::error file=\1,line=\2,col=\3::\4|' \
            shellcheck.out || true

          if [ "$rc" -ne 0 ]; then
            echo "::error::shellcheck reported findings. Fix them, or add a narrowly scoped '# shellcheck disable=SCxxxx' on the line above with a reason."
            exit 1
          fi
          echo "ok: ${#files[@]} script(s) clean"

  # ---------------------------------------------------------------------------
  # systemd units
  # ---------------------------------------------------------------------------
  #
  # scripts/systemd/*.{service,timer} schedule the health check, and until this
  # job existed nothing validated them. A unit that fails to load does not fail
  # loudly -- `systemctl enable` succeeds and the timer simply never fires,
  # which is indistinguishable from the 58 silent nights this alerting was
  # added to end.
  #
  # `systemd-analyze verify` parses the units, rejects unknown directives, and
  # resolves ExecStart and WorkingDirectory on disk. Verified that the ExecStart
  # resolution is real, not cosmetic: pointing it at a missing file exits 1 with
  # "Command ... is not executable: No such file or directory".
  systemd:
    name: systemd-analyze verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: systemd-analyze must be available
        run: |
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "::error::systemd-analyze is not on this runner. The units would go unvalidated, which is worse than a red build -- fix the job rather than skipping it."
            exit 1
          fi
          systemd-analyze --version | head -1

      # The units name an absolute path on purpose (see the comment in
      # bsdmirror-health.service), so the tree has to exist there for the
      # ExecStart check to mean anything.
      - name: Stage the deployment at the path the units name
        run: |
          sudo mkdir -p /opt/bsdmirror
          sudo cp -r scripts /opt/bsdmirror/
          sudo chmod +x /opt/bsdmirror/scripts/*.sh
          ls -l /opt/bsdmirror/scripts/health_check.sh

      - name: The path baked into the units must match the installer's default
        run: |
          # scripts/install-health-timer.sh rewrites UNIT_DEFAULT_DIR when
          # --dir differs. If the two ever disagree the substitution silently
          # does nothing and a relocated install points at the wrong tree.
          expected=$(grep -E '^UNIT_DEFAULT_DIR=' scripts/install-health-timer.sh | cut -d'"' -f2)
          if [ -z "$expected" ]; then
            echo "::error file=scripts/install-health-timer.sh::UNIT_DEFAULT_DIR not found"
            exit 1
          fi
          echo "installer default: $expected"
          fail=0
          for unit in scripts/systemd/*.service scripts/systemd/*.timer; do
            if ! grep -q "$expected" "$unit"; then
              echo "::error file=$unit::does not mention $expected, so install-health-timer.sh cannot relocate it"
              fail=1
            fi
          done
          exit "$fail"

      - name: systemd-analyze verify
        run: |
          shopt -s nullglob
          units=(scripts/systemd/*.service scripts/systemd/*.timer)
          if [ "${#units[@]}" -eq 0 ]; then
            echo "::error::no unit files found -- the glob or the directory moved"
            exit 1
          fi
          echo "verifying ${#units[@]} unit(s): ${units[*]}"
          rc=0
          for u in "${units[@]}"; do
            echo "::group::systemd-analyze verify $u"
            set +e
            systemd-analyze verify "$u" 2>&1 | tee verify.out
            trc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$trc" -ne 0 ] || [ -s verify.out ]; then
              echo "::error file=$u::systemd-analyze verify reported problems"
              rc=1
            else
              echo "ok: $u"
            fi
          done
          exit "$rc"

      # The same check against a relocated copy, because that is the code path
      # `install-health-timer.sh --dir` takes and it is not otherwise exercised.
      - name: Verify a relocated copy the way --dir installs it
        run: |
          sudo mkdir -p /srv/mirror
          sudo cp -r scripts /srv/mirror/
          sudo chmod +x /srv/mirror/scripts/*.sh
          mkdir -p relocated
          for u in scripts/systemd/*.service scripts/systemd/*.timer; do
            sed 's#/opt/bsdmirror#/srv/mirror#g' "$u" > "relocated/$(basename "$u")"
          done
          systemd-analyze verify relocated/*.service relocated/*.timer
          echo "relocated units verify clean"

  # ---------------------------------------------------------------------------
  # Aggregate status
  # ---------------------------------------------------------------------------
  # One check to require in branch protection. Without this, adding a job later
  # means remembering to also add it to the protection rule -- which is exactly
  # the kind of step that gets skipped.
  ci:
    name: CI
    if: always()
    needs: [ruff, bandit, pytest, migrations, compose, nginx, docker-build, shellcheck, systemd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # This job exists so branch protection can require ONE check instead of N.
      # That only holds while `needs` names every other job -- and `needs` is
      # maintained by hand, so it decays in exactly the way it was written to
      # prevent: add a job, forget the list, and the new job cannot block a
      # merge. Nothing announces that. So parse this workflow and prove it.
      #
      # A regex rather than a YAML parser: PyYAML is not guaranteed on the
      # runner's system python, and a gate that cannot run is worth less than
      # one that is slightly literal about indentation. The sanity floor below
      # is the important part -- if the parse ever stops finding jobs, this
      # FAILS instead of quietly passing on an empty set.
      - name: needs must list every other job in this workflow
        run: |
          python3 - <<'PYNEEDS'
          import re
          import sys
          from pathlib import Path

          WORKFLOW = Path(".github/workflows/ci.yml")
          AGGREGATE = "ci"

          lines = WORKFLOW.read_text().splitlines()

          jobs = []
          needs = None
          current = None
          in_jobs = False
          for line in lines:
              if re.match(r"^jobs:\s*$", line):
                  in_jobs = True
                  continue
              if not in_jobs:
                  continue
              if re.match(r"^[A-Za-z_]", line):      # next top-level key ends jobs:
                  break
              job = re.match(r"^  ([A-Za-z_][A-Za-z0-9_-]*):\s*$", line)
              if job:
                  current = job.group(1)
                  jobs.append(current)
                  continue
              if current == AGGREGATE:
                  found = re.match(r"^    needs:\s*\[([^\]]*)\]\s*$", line)
                  if found:
                      needs = [n.strip() for n in found.group(1).split(",") if n.strip()]

          # Sanity floor: a parser that silently matches nothing would turn this
          # gate into a no-op, which is the class of bug it was written for.
          if len(jobs) < 2:
              print("::error::parsed %d jobs from %s -- the parser is broken, not the "
                    "workflow. Fix this step; do not delete it." % (len(jobs), WORKFLOW))
              sys.exit(1)
          if AGGREGATE not in jobs:
              print("::error::no '%s' job found in %s" % (AGGREGATE, WORKFLOW))
              sys.exit(1)
          if needs is None:
              print("::error::could not read the `needs:` list of the '%s' job. It must "
                    "be a single-line flow sequence, e.g. needs: [a, b, c]."
                    % AGGREGATE)
              sys.exit(1)

          expected = [j for j in jobs if j != AGGREGATE]
          missing = [j for j in expected if j not in needs]
          unknown = [n for n in needs if n not in jobs]

          print("jobs in workflow (%d): %s" % (len(jobs), ", ".join(jobs)))
          print("%s.needs      (%d): %s" % (AGGREGATE, len(needs), ", ".join(needs)))

          fail = 0
          if missing:
              print("::error::these jobs are not in `%s.needs`, so they cannot block a "
                    "merge through the required '%s' check: %s"
                    % (AGGREGATE, AGGREGATE, ", ".join(missing)))
              fail = 1
          if unknown:
              print("::error::`%s.needs` names jobs that do not exist: %s"
                    % (AGGREGATE, ", ".join(unknown)))
              fail = 1
          if fail:
              sys.exit(1)
          print("every job is required by '%s'" % AGGREGATE)
          PYNEEDS

      - name: Fail unless every job succeeded
        # Passed through env rather than interpolated into the script body: the
        # standard way to keep a ${{ }} expansion out of the shell's parser.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::at least one CI job did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
          echo "all jobs succeeded"
