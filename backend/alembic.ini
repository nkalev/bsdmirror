# Alembic configuration for bsdmirror.
#
# WHY THIS FILE IS IN backend/ AND NOT AT THE REPO ROOT
# -----------------------------------------------------
# backend/Dockerfile does `COPY backend/ .` into WORKDIR /app, so everything
# under backend/ arrives in the image with no new COPY line, no new `!` entry in
# the root .dockerignore, and no change to the `docker-build` CI job that
# asserts the build context is exactly backend/, shared/ and sync/. A root-level
# alembic/ would have needed all three, and the migration scripts must be inside
# the image: `scripts/migrate.sh` runs them there, against the compose network.
#
# In the image this file is /app/alembic.ini and the scripts are /app/alembic/.
# In a checkout it is backend/alembic.ini and backend/alembic/. `%(here)s` is
# the directory holding this file, so script_location resolves in both without
# depending on the current working directory.
#
# THERE IS NO sqlalchemy.url HERE, ON PURPOSE
# -------------------------------------------
# It would be a database password in a tracked file. alembic/env.py builds the
# URL from POSTGRES_* at run time, exactly as backend/app/core/config.py and
# sync/sync_service.py already do. See the comment there.

[alembic]
script_location = %(here)s/alembic

# Filenames sort chronologically and say what they do, instead of being 12 hex
# characters. `alembic history` is readable from `ls`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamps in migration filenames and in the `Create Date` header are UTC.
# The server runs UTC; a developer laptop may not, and a migration ordering that
# depends on whose clock wrote it is not an ordering.
timezone = UTC

# Deliberately NOT set: prepend_sys_path.
#
# `import shared.models` has to resolve both at /app (image: shared/ is
# /app/shared, alembic.ini is /app/alembic.ini) and in a checkout (shared/ is at
# the repo root, alembic.ini is one level down in backend/). A single relative
# path cannot be right in both, and two paths would put a wrong one on sys.path
# in each. env.py walks up from its own location looking for shared/models
# instead, and raises with the paths it tried if it does not find it.

[post_write_hooks]
# None configured. `ruff check .` in CI already covers backend/alembic/versions/
# -- a generated migration that fails lint fails the build like any other file.

# ---------------------------------------------------------------------------
# Logging. Required: env.py calls fileConfig() on this file, which raises
# without these sections.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# INFO here would echo every statement a migration runs. Raise it by hand while
# debugging a migration; do not commit it raised.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
