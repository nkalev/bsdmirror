# BSD Mirrors - production site configuration.
#
# Active when NGINX_SITE=production, which mounts this directory at
# /etc/nginx/sites-enabled. Selected by scripts/ssl-setup.sh.
#
# THIS FILE CONTAINS NO DOMAIN NAME, AND IT IS NOT GENERATED.
#
# It used to be. scripts/ssl-setup.sh did `cp default.conf production.conf` and
# sed'd the domain into it, which meant the file that actually served production
# was untracked: git could not update it, CI could only validate a re-creation
# of it, and by 2026-08-31 it had drifted to 5 add_header directives against
# default.conf's 21. Nobody could see that, because the file nobody could see
# was the only one that mattered.
#
# The domain now enters in exactly one place -- the certificate paths, which
# certbot writes under /etc/letsencrypt/live/<domain>/ and which nginx cannot
# express as a variable. scripts/nginx-apply.sh renders those two lines into
# snippets/tls-cert.conf. Everything else here is domain-independent and
# tracked, so `git pull` + a graceful reload is enough to change it.
#
# server_name is `_` rather than the domain. There is exactly one server on
# each of :80 and :443, so each is the default server for its listener and
# matches every request regardless of Host -- naming the domain changed nothing
# about which requests were served. The one behavioural difference is in the
# :80 redirect below.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (no redirect)
    #
    # default_type, not `add_header Content-Type`. add_header does not replace
    # Content-Type -- nginx only special-cases Cache-Control, Link, Last-Modified
    # and ETag -- so the old line APPENDED a second Content-Type next to the
    # application/octet-stream that `return 200` inherits from default_type, and
    # in doing so also discarded every add_header from nginx.conf on this
    # response. default_type fixes both: one correct Content-Type, and no
    # add_header at this level so the http-level security headers survive.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Redirect all other HTTP to HTTPS.
    #
    # $host, not $server_name. server_name is `_` here, so $server_name would
    # redirect to the literal "https://_/". $host is the Host header the client
    # actually sent, lowercased with any port stripped, which for every real
    # request is the mirror's own domain.
    #
    # Named behavioural change from the pre-2026-08-31 config: a request whose
    # Host is not the domain (an IP address, a scanner probe) is now redirected
    # to https on that same Host instead of being canonicalised to the domain.
    # It lands on the 443 server either way; a client that reached us by IP gets
    # a certificate name mismatch, which it had coming.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Docker DNS resolver (must be in server block for variable proxy_pass)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SSL Configuration
    #
    # The certificate paths are the only domain-dependent lines in this file.
    # certbot writes to /etc/letsencrypt/live/<domain>/ and nginx does not allow
    # a variable in ssl_certificate without moving certificate loading to every
    # handshake, so these two lines are rendered by scripts/nginx-apply.sh from
    # DOMAIN in .env. That script is idempotent and is run by ssl-setup.sh, by
    # deploy.sh whenever a deploy touches nginx/, and by the certbot renewal
    # cron entry.
    #
    # If this include is missing, `nginx -t` fails loudly and the container
    # refuses to start. That is the intended failure: it means ssl-setup.sh has
    # not been run on this host, and the alternative -- starting without TLS --
    # is worse.
    include /etc/nginx/host/snippets/tls-cert.conf;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration (TLS 1.2+ only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # This block needs Strict-Transport-Security, so it does NOT inherit the
    # add_header list from nginx.conf and has to restate it. Adding HSTS alone
    # here is what previously dropped X-Frame-Options, X-Content-Type-Options
    # and Referrer-Policy from every HTTPS response. The snippet is the whole
    # set plus HSTS.
    include /etc/nginx/host/snippets/security-headers-tls.conf;

    # Root for static files
    root /var/www/public;
    index index.html;

    # ===========================================
    # Auth Endpoint (stricter rate limit for brute force protection)
    # ===========================================
    location = /api/auth/token {
        limit_req zone=auth_limit burst=5 nodelay;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===========================================
    # API Endpoints
    # ===========================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===========================================
    # Admin Panel
    # ===========================================
    location /admin {
        limit_req zone=api_limit burst=10 nodelay;

        alias /var/www/public/admin;
        try_files $uri $uri/ /admin/index.html;

        # X-Robots-Tag is the only header this location actually wants, but
        # adding it discards everything from the 443 server block. That is why
        # /admin -- the one authenticated surface, rendering server data into
        # HTML from admin.js -- was served with no CSP, no HSTS and no
        # X-Frame-Options while returning x-robots-tag and nothing else.
        # Include first, then add. Never add instead of.
        include /etc/nginx/host/snippets/security-headers-tls.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ===========================================
    # FreeBSD Mirror
    # ===========================================
    location /FreeBSD/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        alias /data/mirrors/freebsd/pub/FreeBSD/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;

        # Optimize for large file downloads
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Allow resume
        max_ranges 1;
    }

    # ===========================================
    # NetBSD Mirror
    # ===========================================
    location /NetBSD/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        alias /data/mirrors/netbsd/pub/NetBSD/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        max_ranges 1;
    }

    # ===========================================
    # OpenBSD Mirror
    # ===========================================
    location /OpenBSD/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        alias /data/mirrors/openbsd/pub/OpenBSD/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        max_ranges 1;
    }

    # ===========================================
    # Static Files (Web UI)
    # ===========================================
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;

            # A third instance of the same trap: this nested location adds
            # Cache-Control, so every stylesheet, script, font and image was
            # served with no CSP, no HSTS and no nosniff. nosniff matters most
            # here, and CSP matters on the SVGs -- /img/*.svg is navigable
            # directly, where an SVG renders as a document and any <script>
            # inside it executes.
            #
            # Cache-Control intentionally keeps its original form with no
            # `always`: it must not be applied to a 404 or a 502.
            add_header Cache-Control "public, immutable";
            include /etc/nginx/host/snippets/security-headers-tls.conf;
        }
    }

    # ===========================================
    # Error pages
    # ===========================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /var/www/public;
    }
}
