# Development Nginx Config - HTTP only, no SSL
# For local development and testing
#
# Security headers, including the Content-Security-Policy, are NOT declared
# here. They are inherited whole from the http block of nginx/nginx.conf,
# which works precisely because this file contains no add_header of its own --
# a single add_header anywhere below would silently discard all of them.
# Verify with `curl -D - http://localhost/` rather than by reading this file.
#
# Deliberate difference from production: no Strict-Transport-Security. This
# server is plaintext on localhost, where HSTS is both ignored (RFC 6797
# sec. 7.2) and, if a browser did honour it, would pin every other localhost
# project to HTTPS.
#
# Dev now enforces the same CSP as production on purpose. It previously had
# none, so a policy violation could only ever be discovered after deploying --
# which is the failure mode this whole config change exists to remove. If
# something works in dev and breaks in production, that gap was the reason.

server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver (required for variable proxy_pass)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Root directory for static files
    root /var/www/public;
    index index.html;

    # Health check endpoint. One definition, shared by every server block in
    # every profile -- see nginx/snippets/health.conf. It was inlined here, and
    # in bootstrap.conf, and in the :80 server of production.conf, and NOT in
    # the :443 server, where /health therefore returned the homepage with a 200.
    #
    # Dev has no TLS server at all, so there is only one block to include it in
    # here. That is exactly why the divergence was invisible in dev.
    include /etc/nginx/host/snippets/health.conf;

    # API proxy
    location /api/ {
        set $backend_upstream http://backend:8000;
        # proxy_pass WITHOUT a URI part. This is not a style choice.
        #
        # It used to read `proxy_pass $backend_upstream/api/;`. When proxy_pass
        # contains variables, nginx does NOT do the usual "replace the matched
        # location prefix with this URI and append the remainder" -- it sends
        # the literal URI given here and DISCARDS everything after the location
        # prefix. So every request under /api/ arrived at the backend as
        # exactly `/api/`:
        #
        #     GET /api/health         ->  backend saw  GET /api/   404
        #     POST /api/auth/token    ->  backend saw  POST /api/  404
        #
        # The entire API surface was dead in the dev and bootstrap profiles.
        # Found on 2026-08-31 by running the stack and reading the backend
        # access log, not by reading this file -- `nginx -t` accepts both forms
        # and the difference is invisible until a request is made.
        #
        # With no URI part, nginx forwards the client's request URI unchanged,
        # which is what sites/production/production.conf has always done and why
        # production was unaffected. Keep the two profiles the same shape: a dev
        # config that cannot reproduce production is how a bug reaches a deploy.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin panel
    location /admin/ {
        alias /var/www/public/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BSD mirror file directories
    location /FreeBSD/ {
        alias /data/mirrors/freebsd/pub/FreeBSD/;
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /NetBSD/ {
        alias /data/mirrors/netbsd/pub/NetBSD/;
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /OpenBSD/ {
        alias /data/mirrors/openbsd/pub/OpenBSD/;
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
