# Development Nginx Config - HTTP only, no SSL
# For local development and testing
#
# Security headers, including the Content-Security-Policy, are NOT declared
# here. They are inherited whole from the http block of nginx/nginx.conf,
# which works precisely because this file contains no add_header of its own --
# a single add_header anywhere below would silently discard all of them.
# Verify with `curl -D - http://localhost/` rather than by reading this file.
#
# Deliberate difference from production: no Strict-Transport-Security. This
# server is plaintext on localhost, where HSTS is both ignored (RFC 6797
# sec. 7.2) and, if a browser did honour it, would pin every other localhost
# project to HTTPS.
#
# Dev now enforces the same CSP as production on purpose. It previously had
# none, so a policy violation could only ever be discovered after deploying --
# which is the failure mode this whole config change exists to remove. If
# something works in dev and breaks in production, that gap was the reason.

server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver (required for variable proxy_pass)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Root directory for static files
    root /var/www/public;
    index index.html;

    # Health check endpoint
    #
    # default_type, not `add_header Content-Type`. add_header does not replace
    # Content-Type (nginx special-cases only Cache-Control, Link, Last-Modified
    # and ETag), so the old line emitted a SECOND Content-Type alongside the
    # inherited application/octet-stream -- and, being an add_header, discarded
    # every security header nginx.conf sets on this response.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # API proxy
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin panel
    location /admin/ {
        alias /var/www/public/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BSD mirror file directories
    location /FreeBSD/ {
        alias /data/mirrors/freebsd/pub/FreeBSD/;
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /NetBSD/ {
        alias /data/mirrors/netbsd/pub/NetBSD/;
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /OpenBSD/ {
        alias /data/mirrors/openbsd/pub/OpenBSD/;
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
