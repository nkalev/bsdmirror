# Bootstrap Nginx Config - HTTP only for initial SSL certificate acquisition
# This is used ONLY during initial setup before SSL certificates are obtained
#
# Security headers, including the Content-Security-Policy, are NOT declared
# here. They are inherited whole from the http block of nginx/nginx.conf,
# which works precisely because this file contains no add_header of its own --
# a single add_header anywhere below would silently discard all of them.
#
# Do NOT add Strict-Transport-Security to this file. This config is what serves
# port 80 while certbot completes the ACME http-01 challenge, i.e. before a
# certificate exists. Pinning HSTS here would tell every browser that saw the
# site during setup to refuse the plaintext fallback, and the site has no
# working HTTPS yet to fall forward to. HSTS belongs only in the 443 server of
# default.conf, which is what scripts/ssl-setup.sh switches to afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker DNS resolver (required for variable proxy_pass)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check
    #
    # default_type, not `add_header Content-Type`. add_header does not replace
    # Content-Type (nginx special-cases only Cache-Control, Link, Last-Modified
    # and ETag), so the old line emitted a SECOND Content-Type alongside the
    # inherited application/octet-stream -- and, being an add_header, discarded
    # every security header nginx.conf sets on this response.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # API proxy (needed for health checks)
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root - serve basic page
    root /var/www/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # BSD mirror directories
    location /FreeBSD/ {
        alias /data/mirrors/freebsd/pub/FreeBSD/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /NetBSD/ {
        alias /data/mirrors/netbsd/pub/NetBSD/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /OpenBSD/ {
        alias /data/mirrors/openbsd/pub/OpenBSD/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Admin panel
    location /admin/ {
        alias /var/www/public/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
}
