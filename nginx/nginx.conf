user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript;

    # =======================================================================
    # Security headers
    # =======================================================================
    #
    # READ THIS BEFORE ADDING AN add_header ANYWHERE.
    #
    # add_header is NOT inherited the way most nginx directives are. The
    # include below is applied to a server{} or location{} only if that block
    # defines NO add_header of its own. The moment a lower level adds a single
    # header, it replaces this whole list rather than extending it -- silently,
    # with no warning from `nginx -t`.
    #
    # That is how this deployment ended up serving /admin with no CSP and no
    # HSTS: the 443 server added HSTS+CSP (dropping the four headers here), and
    # `location /admin` then added X-Robots-Tag (dropping HSTS+CSP in turn).
    #
    # THE RULE: any block that needs its own add_header must include the header
    # set first, then add its own after it:
    #
    #     include /etc/nginx/host/snippets/security-headers.conf;      # or -tls
    #     add_header X-Robots-Tag "noindex, nofollow" always;
    #
    # Grep for `snippets/security-headers` before adding a header to a new
    # location. The list used to be re-stated by hand in four places because
    # docker-compose.yml bind-mounted exactly two individual files and an
    # include had nowhere to live. It now mounts ./nginx as a directory at
    # /etc/nginx/host, so the copies are gone.
    #
    # X-XSS-Protection is not here and is not coming back. The XSS auditor it
    # controlled is gone from every current browser (Chrome dropped it in 78,
    # Edge followed, Firefox never shipped it) and "1; mode=block" was itself
    # exploitable as a cross-site information leak. $csp_policy below is the
    # replacement. If a scanner demands the header, send "0" -- which disables
    # the buggy auditor -- never "1; mode=block".
    #
    # DENY, not SAMEORIGIN: $csp_policy says frame-ancestors 'none' and there
    # is no iframe anywhere in frontend/public. SAMEORIGIN would have left the
    # legacy header more permissive than the modern one it backstops.
    include /etc/nginx/host/snippets/security-headers.conf;

    # -----------------------------------------------------------------------
    # The policy itself, written once.
    # -----------------------------------------------------------------------
    #
    # A map is used purely to name a constant: the key is irrelevant and every
    # request takes the default. The point is that the policy string exists in
    # exactly one place even though four blocks emit it, so the copies cannot
    # drift. An unknown $csp_policy is a hard `nginx -t` failure, not a
    # silently missing header.
    #
    # Derived by enumerating frontend/public, not by copying a template:
    #
    #   default-src 'self'    floor for anything not named below.
    #   script-src  'self'    index.html and admin/index.html load exactly one
    #                         external <script> each (/js/main.js,
    #                         /admin/js/admin.js). No inline <script>, no
    #                         eval, no new Function, no document.write, no
    #                         dynamically created <script> anywhere.
    #                         KNOWN BREAKAGE, pre-existing: index.html lines
    #                         132, 168 and 204 are onclick="copyRsync(...)"
    #                         attributes. CSP blocks inline event handlers, so
    #                         the three "Copy rsync URL" buttons are already
    #                         dead in production today -- this policy is not
    #                         what breaks them. 'unsafe-inline' would revive
    #                         them at the cost of the entire policy; the fix is
    #                         an addEventListener in main.js and belongs to the
    #                         `developer` agent.
    #   style-src   'self' 'unsafe-inline'
    #                         COMPROMISE. Required by two things that exist
    #                         today: 24 inline style="..." attributes in
    #                         admin/js/admin.js, and the inline <style> blocks
    #                         in 404.html and 50x.html. Phase 5 moves the
    #                         admin.js attributes into classes; the error pages
    #                         need their <style> hashed or extracted. Drop
    #                         'unsafe-inline' only when BOTH are done --
    #                         removing it early breaks admin layout and both
    #                         error pages with no error message.
    #   img-src     'self'    /img/*.svg and /img/favicon.svg. 'data:' was
    #                         dropped: no data: or base64 image URI exists in
    #                         any html, css or js under frontend/public.
    #   font-src    'self'    all 13 @font-face url() in css/fonts.css point at
    #                         /fonts/*.woff2. Nothing reaches fonts.gstatic.com
    #                         any more; the only googleapis.com string left in
    #                         the tree is a provenance comment.
    #   connect-src 'self'    both clients fetch a relative '/api' base
    #                         (js/main.js:31, admin/js/admin.js:11). No
    #                         WebSocket, no EventSource.
    #   object-src / frame-src 'none'
    #                         tighter than the default-src 'self' they would
    #                         otherwise inherit. No <object>, <embed> or
    #                         <iframe> exists, so 'none' costs nothing and
    #                         removes an injected-frame vector.
    #   frame-ancestors 'none'  nothing is meant to embed this site.
    #   base-uri / form-action 'self'
    #                         stops an injected <base> from re-pointing every
    #                         relative URL, and stops form exfiltration.
    #
    # The nginx autoindex pages under /FreeBSD/, /NetBSD/ and /OpenBSD/ are
    # unaffected: autoindex emits <html><head><title>, <h1>, <hr> and <pre><a>
    # only -- no <script>, no <style>, no style attribute. Verified by curl,
    # not by reading the module source.
    #   style-src   'self'    'unsafe-inline' WAS here and is now gone. It was
    #                         required by 24 inline style="..." attributes in
    #                         admin/js/admin.js and an inline <style> block in
    #                         each of 404.html and 50x.html. All are now classes
    #                         in stylesheets, and two tests hold that at zero
    #                         (test_admin_inline_styles.py,
    #                         test_error_pages_inline_styles.py) -- reintroduce
    #                         one and CI fails rather than the page silently
    #                         losing its styling in production.
    #
    #                         What still works without it, verified in a real
    #                         browser under exactly this policy rather than
    #                         assumed: CSSOM assignment. `el.style.background =
    #                         '...'` applies (js/main.js:79-100 status pulse,
    #                         admin.js:299 toast) and so does `el.style.cssText`.
    #                         What does NOT apply is
    #                         `el.setAttribute('style', '...')`, which is
    #                         silently ignored -- the declaration is dropped and
    #                         nothing throws. There are no uses of it today;
    #                         adding one would look correct in review and do
    #                         nothing in production, so reach for a class.
    map $host $csp_policy {
        default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    # Hide nginx version
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # A limit_conn_zone stood here, unused: it was declared but no limit_conn
    # directive referenced it anywhere in nginx/. Removed rather than wired up.
    # A zone that reserves 10m of shared memory and enforces nothing is worse
    # than no zone at all, because the next reader assumes the mirror paths are
    # connection-limited when they are not.
    #
    # Not wired up in this change on purpose. The place it belongs is the three
    # mirror locations in default.conf, and per-IP connection caps there are a
    # traffic decision that needs real numbers: a NAT'd university or a
    # parallel poudriere fetch legitimately opens many connections, and the
    # failure mode is a silent 503 to a real downloader. This repo has already
    # shipped exactly that bug once with limit_conn on login. It wants its own
    # change with load evidence, which is:
    #     limit_conn_zone $binary_remote_addr zone=conn_limit:10m;   # here
    #     limit_conn conn_limit <n>;                                 # per mirror location

    # Docker DNS resolver for runtime upstream resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Include the active site configuration.
    #
    # /etc/nginx/sites-enabled is a DIRECTORY bind mount of exactly one profile
    # directory -- ./nginx/sites/${NGINX_SITE}/ -- see docker-compose.yml. The
    # glob therefore matches exactly one file, and which one is decided by the
    # mount rather than by anything in this file.
    #
    # The obvious alternative, mounting ./nginx/sites/ here wholesale, would
    # load dev.conf, bootstrap.conf and production.conf together: three server
    # blocks fighting over `listen 80` with conflicting server_name values. One
    # profile directory per mount is what keeps that impossible.
    include /etc/nginx/sites-enabled/*.conf;
}
