# ============================================================================
# DO NOT PUT CONFIGURATION IN THIS FILE. DO NOT EDIT IT AT ALL.
# ============================================================================
#
# This is the only file in the repository that is bind-mounted into the nginx
# container as an individual file, at /etc/nginx/nginx.conf. Everything else
# arrives through directory mounts.
#
# Why the distinction matters
# ---------------------------
# A single-file bind mount pins an inode. `git checkout` does not edit files in
# place -- it writes a new file and renames it over the old name, which produces
# a NEW inode. The container keeps the old one. On 2026-08-31 that is exactly
# what happened: the host had nginx/nginx.conf at inode 55837494 while the
# container still had inode 55836931, dated 2026-02-12. `nginx -t` passed and
# `nginx -s reload` succeeded -- both re-reading the February file. A green
# signal with nothing underneath it.
#
# A DIRECTORY bind mount does not pin anything: the kernel resolves the path on
# every open(), so a renamed-over file is seen immediately. That is why
# docker-compose.yml mounts ./nginx as a directory at /etc/nginx/host and
# ./nginx/sites/<profile> as a directory at /etc/nginx/sites-enabled.
#
# /etc/nginx/nginx.conf cannot itself be a directory mount, so this stub exists
# instead. It is immune to the inode trap for one reason only: it never changes.
# Keep it that way. .github/workflows/ci.yml enforces that this file contains
# exactly one directive.
#
# It exists rather than passing `nginx -c /etc/nginx/host/nginx.conf` so that a
# bare `docker compose exec nginx nginx -t`, which is what CLAUDE.md documents
# and what an operator types under pressure, validates the real configuration.
# With -c and no stub, a bare `nginx -t` would validate the stock image config
# and report success -- another green signal with nothing underneath it.

include /etc/nginx/host/nginx.conf;
