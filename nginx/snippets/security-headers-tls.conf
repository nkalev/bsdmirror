# The base set plus HSTS. For blocks reachable only over HTTPS.
#
# Include this instead of security-headers.conf anywhere inside the 443 server
# of sites/production/production.conf. Including both would emit the four base
# headers twice.
include /etc/nginx/host/snippets/security-headers.conf;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
