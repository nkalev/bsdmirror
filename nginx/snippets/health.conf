# The nginx liveness endpoint, written once and included by EVERY server block.
#
# WHY THIS IS A SNIPPET AND NOT THREE COPIES
# ------------------------------------------
# It was three copies, and one of them was missing. `location = /health` existed
# in the :80 server of sites/production/production.conf and nowhere in the :443
# server, so over HTTPS the request fell through to `location /`, hit
# `try_files $uri $uri/ /index.html`, and returned 200 with the homepage:
#
#     http://<domain>/health   ->  200  text/plain  "OK"
#     https://<domain>/health  ->  200  text/html   "<!DOCTYPE html>..."
#
# Every external monitor points at the HTTPS URL. A status-code check cannot see
# the difference, so the endpoint reported healthy by returning a web page. Both
# our own probes -- scripts/deploy.sh verify_security_headers() and the CI
# header job -- read status and headers only, and both called it green.
#
# A `location` cannot be inherited between server blocks: nginx matches
# locations only inside the server that handled the request. An include is
# therefore the only way to have one definition and two servers. Any new server
# block MUST include this file; .github/workflows/ci.yml enforces that
# mechanically (structural check + a body probe on every profile and scheme)
# rather than leaving it to review.
#
# WHAT THIS ENDPOINT MEANS
# ------------------------
# "This nginx process is up and serving." Nothing more, deliberately.
# docker-compose.yml runs `curl -f http://localhost/health` as the nginx
# container healthcheck and scripts/deploy.sh refuses to deploy when nginx is
# not up, so this response must NOT depend on postgres, redis or the backend: a
# database outage would otherwise mark nginx unhealthy and block the deploy that
# fixes it.
#
# For "is the platform actually working", use the backend endpoints, which do
# real checks: /api/health (liveness) and /api/health/detailed (postgres and
# redis, with a 5s timeout each, reporting status: degraded). Point external
# monitoring at /api/health/detailed and alert on the JSON `status` field --
# not at this path, which is a static string by design.
#
# default_type, not `add_header Content-Type`. add_header does not replace
# Content-Type -- nginx special-cases only Cache-Control, Link, Last-Modified
# and ETag -- so `add_header Content-Type` emits a SECOND Content-Type beside
# the application/octet-stream that `return 200` inherits, and, being an
# add_header, discards every security header nginx.conf set on this response.
#
# Exact match (`= /health`), not the prefix match dev and bootstrap used to
# carry: `location /health` also answers /healthcheck, /health.php and
# /health-anything with 200 OK, which is a small lie of the same family.
#
# Body is "OK\n" on every profile and every scheme. CI asserts the exact bytes.
location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}
