# The base security header set. Included, never retyped.
#
# add_header is not inherited the way most nginx directives are: a block that
# defines ANY add_header replaces the whole inherited list rather than extending
# it, silently, with no warning from `nginx -t`. Before this file existed the
# rule was "re-state all four by hand in every block that adds a header", and
# three separate blocks had already got it wrong (the 443 server, /admin, and
# the static-asset location), each dropping the entire set.
#
# The rule is now: any block that needs its own add_header includes this file
# first, then adds its own after it. One line instead of four, and a missing
# include is visible by grepping for `include` rather than by counting
# add_header directives across 240 lines.
#
# Strict-Transport-Security is deliberately NOT here -- see
# security-headers-tls.conf, which is this file plus HSTS. HSTS is meaningless
# over plaintext (RFC 6797 sec. 7.2), and emitting it from the HTTP-only dev and
# bootstrap configs would poison localhost and would pin HTTPS before
# scripts/ssl-setup.sh has obtained a certificate.
#
# $csp_policy is defined by the map in nginx/nginx.conf. An undefined variable
# there is a hard `nginx -t` failure, not a silently missing header.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $csp_policy always;
