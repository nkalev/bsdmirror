# Development override for Docker Compose
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./data/mirrors:/data/mirrors:ro
      - ./backend/app:/app/app:ro
    environment:
      - LOG_LEVEL=DEBUG
  
  sync:
    volumes:
      - ./data/mirrors:/data/mirrors
    environment:
      - LOG_LEVEL=DEBUG
  
  nginx:
    ports:
      - "8080:80"
    # No nginx config mounts here.
    #
    # Compose merges `volumes` by target path, so the three config mounts this
    # block used to carry were ADDED to the base file's, not substituted for
    # them. The result was ./nginx/sites/dev.conf mounted twice under two names
    # -- /etc/nginx/sites-enabled/active.conf and .../default.conf -- so the dev
    # stack loaded two identical `listen 80; server_name localhost;` servers and
    # nginx logged `conflicting server name "localhost" on 0.0.0.0:80, ignored`
    # on every start. Harmless by luck: the duplicate was byte-identical.
    #
    # The base file already selects the dev profile: NGINX_SITE defaults to
    # `dev`, which mounts ./nginx/sites/dev/ at /etc/nginx/sites-enabled. Adding
    # anything here would reintroduce the duplicate.
    volumes:
      - ./data/mirrors/freebsd/pub/FreeBSD:/data/mirrors/freebsd/pub/FreeBSD:ro
      - ./data/mirrors/netbsd/pub/NetBSD:/data/mirrors/netbsd/pub/NetBSD:ro
      - ./data/mirrors/openbsd/pub/OpenBSD:/data/mirrors/openbsd/pub/OpenBSD:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
